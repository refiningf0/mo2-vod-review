<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MO2 VOD Review</title>
<style>
  /* Dark, gold-trimmed, numbers first -- a post-match screen rather than a
     spreadsheet. Everything is CSS: the report has to open with no network. */
  :root{
    --bg:#0b0d11; --panel:#14171d; --panel-2:#1a1e26;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
    --ink:#e9edf3; --mid:#98a2b0; --soft:#687382;
    --accent:#6d8cf5; --accent-dim:rgba(109,140,245,.45);
    --out:#3fbf78; --in:#ef5a52; --magic:#a78bfa; --heal:#43b8e0;
    /* A counter is the one thing here you did in the instant it mattered, so
       it gets the hot gold rather than another cool UI colour. Three stops:
       a near-white core, the gold itself, and a warm halo to bleed outward. */
    --gold:#ffc74a; --gold-core:#fff3c4; --gold-halo:rgba(255,183,45,.75);
    --r:14px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;color:var(--ink);
    background:
      radial-gradient(1000px 480px at 50% -200px, rgba(109,140,245,.09), transparent 70%),
      var(--bg);
    background-attachment:fixed;
    font:15px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:44px 20px 120px;}
  .num{font-variant-numeric:tabular-nums;}

  /* ---- header ---- */
  .eyebrow{
    font-size:.64rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--soft);margin:0 0 10px;font-weight:600;
  }
  h1{
    font-size:clamp(1.5rem,3.4vw,2.15rem);margin:0 0 12px;line-height:1.15;
    letter-spacing:-.02em;font-weight:700;
    background:linear-gradient(180deg,#ffffff,#aab6c6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    overflow-wrap:anywhere;
  }
  h1 a.clip{
    color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:10px;
  }
  h1 a.clip svg{
    flex:none;color:var(--accent);opacity:.6;transition:opacity .15s,transform .15s;
  }
  h1 a.clip:hover svg{opacity:1;transform:scale(1.08);}
  h1 a.clip:hover{text-decoration:underline;text-underline-offset:5px;
                  text-decoration-color:var(--accent-dim);}

  .meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px;padding:0;}
  .meta span{
    font-size:.72rem;color:var(--mid);border:1px solid var(--line);
    background:rgba(255,255,255,.02);border-radius:999px;padding:4px 11px;
    font-variant-numeric:tabular-nums;
  }

  /* ---- drop target ---- */
  .drop{
    display:block;border:1.5px dashed var(--line-2);border-radius:var(--r);
    padding:56px 20px;text-align:center;color:var(--mid);cursor:pointer;
    background:linear-gradient(180deg,var(--panel),rgba(17,22,32,.4));
    transition:border-color .15s,background .15s;
  }
  .drop:hover,.drop.over{border-color:var(--accent-dim);background:var(--panel-2);}
  .drop input{display:none;}
  .drop b{color:var(--ink);display:block;margin-bottom:5px;font-size:1.1rem;}

  /* ---- cards ---- */
  .card{
    position:relative;background:linear-gradient(180deg,var(--panel),rgba(15,20,29,.75));
    border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -30px #000;
  }
  h2{
    display:flex;align-items:center;gap:10px;
    font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;
    color:var(--mid);font-weight:600;margin:0 0 16px;
  }
  h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent);}

  /* ---- headline numbers ---- */
  /* The headline figures step back: they are the summary, not the story. */
  .strip{display:flex;flex-wrap:wrap;gap:26px;margin:0 0 22px;padding:0 2px;}
  .strip div{display:flex;align-items:baseline;gap:8px;}
  .strip .k{font-size:.63rem;text-transform:uppercase;letter-spacing:.15em;color:var(--soft);font-weight:600;}
  .strip b{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .strip .sub{font-size:.72rem;color:var(--soft);}
  .strip .dealt b{color:var(--out);} .strip .taken b{color:var(--in);}

  /* Stretch, not start: the roster is the taller column, and letting the chart
     column fill the same height gives the slider somewhere to sit. It used to
     stop wherever the chart ended, leaving it stranded mid-card with the
     roster still running on beside it. */
  .lead-grid{display:grid;grid-template-columns:302px 1fr;gap:22px;align-items:stretch;}
  .chart{display:flex;flex-direction:column;}
  /* Everything above is measured; this pushes the controls to the bottom edge. */
  .chart .rangewrap{margin-top:auto;}
  .picks h2{margin-bottom:12px;}
  .chart h2{margin-bottom:14px;}
  .focusnote{
    margin-left:auto;font-size:.7rem;letter-spacing:0;text-transform:none;
    color:var(--accent);font-weight:600;
  }
  .chart h2::after{display:none;}

  /* Everyone, not a shortlist -- the chart is driven from here, so leaving
     someone out would put them out of reach. */
  .rosterlist{
    max-height:322px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px;
    scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent;
  }
  .rosterlist::-webkit-scrollbar{width:8px;}
  .rosterlist::-webkit-scrollbar-track{background:transparent;}
  .rosterlist::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.13);border-radius:99px;
    border:2px solid transparent;background-clip:content-box;
  }
  .rrow{display:flex;align-items:center;gap:2px;}
  /* Out of the way until wanted, but still reachable by keyboard. */
  .ex{
    flex:none;background:none;border:1px solid transparent;color:var(--soft);
    border-radius:8px;cursor:pointer;padding:0;
    transition:opacity .12s,color .12s,background .12s;
  }
  .ex svg{display:block;}
  /* Always on the row, dim, so it is clear every name can be switched off --
     and clear which ones already are. */
  .rrow .ex{
    width:26px;height:26px;display:grid;place-items:center;
    opacity:.3;color:var(--soft);
  }
  .rrow:hover .ex{opacity:.75;}
  .rrow .ex:hover,.rrow .ex:focus-visible{opacity:1;}

  /* Set aside: the row stays legible enough to read and to click back on. */
  .rrow.off .pick{opacity:.34;}
  .rrow.off .ex{opacity:1;color:var(--in);}
  .rrow.off .ex:hover{background:rgba(239,90,82,.14);border-color:rgba(239,90,82,.35);}

  .pick{
    flex:1;min-width:0;display:grid;grid-template-columns:26px 1fr auto;
    align-items:center;gap:9px 10px;
    background:none;border:1px solid transparent;color:inherit;font:inherit;
    padding:7px 8px;border-radius:9px;cursor:pointer;text-align:left;
    transition:background .12s,border-color .12s;
  }
  .pick .minibar{grid-column:2 / -1;display:flex;align-items:center;height:5px;margin-top:5px;}
  .pick .minibar .half{flex:1;display:flex;height:4px;}
  .pick .minibar .half.l{justify-content:flex-end;}
  .pick .minibar .fill{border-radius:99px;}
  .pick .minibar .half.l .fill{background:var(--in);}
  .pick .minibar .half.r .fill{background:var(--out);}
  .pick .minibar .spine{width:1px;height:7px;background:var(--line-2);flex:none;}
  .pick .amt{font-size:.72rem;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .pick .amt .t{color:var(--in);} .pick .amt .d{color:var(--out);} .pick .amt .z{color:var(--soft);}
  .pick:hover{background:rgba(255,255,255,.04);}
  .pick.on{background:rgba(109,140,245,.12);border-color:var(--accent-dim);}
  .pick .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;}
  .pick .av svg{width:15px;height:15px;}
  .pick .nm{font-size:.83rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pick.on .nm{color:var(--accent);}
  .picks .clear{
    width:100%;margin-top:8px;background:none;border:1px solid var(--line);
    color:var(--soft);border-radius:8px;font:inherit;font-size:.72rem;padding:6px;cursor:pointer;
  }
  .picks .clear:hover{border-color:var(--accent-dim);color:var(--ink);}

  .totals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
  .stat{
    position:relative;overflow:hidden;padding:18px 20px 16px;
    background:linear-gradient(180deg,var(--panel),rgba(15,20,29,.7));
    border:1px solid var(--line);border-radius:var(--r);
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
  }
  .stat::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;opacity:.9;}
  .stat.dealt::before{background:linear-gradient(90deg,var(--out),transparent);}
  .stat.taken::before{background:linear-gradient(90deg,var(--in),transparent);}
  .stat.net::before{background:linear-gradient(90deg,var(--accent),transparent);}
  .stat .k{
    display:block;font-size:.63rem;text-transform:uppercase;letter-spacing:.16em;
    color:var(--soft);margin-bottom:10px;font-weight:600;
  }
  .stat b{
    display:block;font-size:clamp(1.9rem,4.6vw,2.6rem);font-weight:750;line-height:1;
    letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  }
  .stat.dealt b{color:var(--out);text-shadow:0 0 34px rgba(63,191,120,.28);}
  .stat.taken b{color:var(--in);text-shadow:0 0 34px rgba(239,90,82,.24);}
  .stat.net b{color:var(--ink);}
  .stat .sub{display:block;font-size:.74rem;color:var(--soft);margin-top:9px;}

  /* ---- timeline ---- */
  .chartwrap{position:relative;}
  /* A gutter for the scale, so the numbers sit beside the plot rather than on
     top of it. The x labels and the event lane are inset to match. */
  .plot{display:grid;grid-template-columns:42px 1fr;}
  .tl{position:relative;}
  .tl svg{display:block;width:100%;height:210px;overflow:visible;}

  .ylab{position:relative;}
  .ylab span{
    position:absolute;right:9px;transform:translateY(-50%);
    font-size:.62rem;color:var(--soft);font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .xaxis{position:relative;height:17px;margin:5px 0 0 42px;}
  .xaxis span{
    position:absolute;transform:translateX(-50%);
    font-size:.66rem;color:var(--soft);font-variant-numeric:tabular-nums;
  }
  .xaxis span:first-child{transform:none;}
  .xaxis span:last-child{transform:translateX(-100%);}

  /* One lane per stat, each its own row: the label says which, the row holds
     only that stat's moments, and the whole row is the control -- clicking
     anywhere on it marks those hits on the chart above. That replaced a
     separate set of buttons, which meant the count, the marks and the control
     were three things in two places. */
  .lanes{margin:7px 0 0 42px;display:flex;flex-direction:column;gap:5px;}
  .lane{
    position:relative;display:block;width:100%;
    height:28px;padding:0;border-radius:7px;cursor:pointer;text-align:left;
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));
    border:1px solid var(--line);color:var(--mid);font:inherit;
    transition:background .12s,border-color .12s,color .12s;
  }
  /* The track is the whole lane, not a column between the label and the count.
     A mark is placed by its fraction of the window, so the thing it is a
     fraction OF has to be the same width as the chart -- when it was a grid
     column the marks sat inside a band 200px narrower and drifted right of
     the moments they belonged to. Label and count float over the top. */
  .lanetrack{position:absolute;inset:0;}
  .lanelab{
    position:absolute;left:0;top:0;bottom:0;z-index:2;pointer-events:none;
    display:inline-flex;align-items:center;gap:6px;padding:0 22px 0 9px;
    font-size:.63rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;
    white-space:nowrap;border-radius:6px 0 0 6px;
    /* Faded out rather than cut off, so a mark landing early in the window is
       still visible behind the words instead of being hidden by them. */
    background:linear-gradient(90deg,rgba(16,19,25,.94) 0%,
                                     rgba(16,19,25,.94) 68%,
                                     rgba(16,19,25,0) 100%);
  }
  .lanelab svg{width:13px;height:13px;flex:none;color:var(--tone);}
  .lanen{
    position:absolute;right:0;top:0;bottom:0;z-index:2;pointer-events:none;
    display:inline-flex;align-items:center;padding:0 9px 0 16px;
    font-size:.78rem;font-weight:700;
    font-variant-numeric:tabular-nums;color:var(--tone);
    border-radius:0 6px 6px 0;
    background:linear-gradient(270deg,rgba(16,19,25,.94) 0%,
                                      rgba(16,19,25,.94) 55%,
                                      rgba(16,19,25,0) 100%);
  }
  .lane i{
    position:absolute;top:50%;width:9px;height:9px;border-radius:50%;
    transform:translate(-50%,-50%);background:var(--tone);
    box-shadow:0 0 7px -1px var(--tone);
  }
  /* A counter is the heaviest of the three, so it reads largest. */
  .lane.counter i{width:14px;height:14px;}
  .lane.counter{--tone:var(--gold);}
  .lane.good{--tone:var(--out);}
  .lane.bad{--tone:var(--in);}
  .lane:hover{background:rgba(255,255,255,.06);border-color:var(--line-2);}
  .lane.on{
    color:var(--ink);
    background:color-mix(in srgb,var(--tone) 12%,transparent);
    border-color:color-mix(in srgb,var(--tone) 45%,transparent);
  }
  /* Nothing to find, so nothing to click -- but the row stays, because "none"
     is an answer and a row that disappears is not. */
  .lane.zero{opacity:.38;cursor:default;}
  .lane:focus-visible{outline:2px solid var(--tone);outline-offset:2px;}

  /* A counter keeps the lit-ember treatment: stacked shadows rather than one,
     which reads as a lit object instead of a flat disc with a blur behind it. */
  .lane.counter i{
    box-shadow:0 0 0 1px var(--gold-core) inset,
               0 0 7px var(--gold), 0 0 16px var(--gold-halo);
    animation:emberpulse 2.2s ease-in-out infinite;
  }
  @keyframes emberpulse{
    0%,100%{box-shadow:0 0 0 1px var(--gold-core) inset,
                       0 0 6px var(--gold), 0 0 13px var(--gold-halo);}
    50%    {box-shadow:0 0 0 1px var(--gold-core) inset,
                       0 0 11px var(--gold), 0 0 22px var(--gold-halo);}
  }
  @media (prefers-reduced-motion:reduce){ .lane.counter i{animation:none;} }

  .burst{pointer-events:auto;}
  .tip{
    position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;
    background:rgba(11,13,17,.97);border:1px solid var(--line-2);border-radius:9px;
    padding:7px 10px;font-size:.78rem;white-space:nowrap;z-index:5;
    transform:translate(-50%,-100%);box-shadow:0 10px 30px -12px #000;
  }
  /* The marks sit at the very top of the chart, where a tooltip drawn above
     the cursor rides up over the heading. Theirs hangs below instead. */
  .tip.below{transform:translate(-50%,0);}
  .rangewrap{position:relative;height:30px;margin-top:12px;}
  /* Without a visible rail the two handles float with nothing to hold, and it
     reads as decoration rather than a control. */
  .rail{
    position:absolute;left:0;right:0;top:12px;height:6px;border-radius:999px;
    background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line);
  }
  .sel{
    position:absolute;top:0;bottom:0;border-radius:999px;
    background:linear-gradient(90deg,rgba(109,140,245,.55),rgba(109,140,245,.75));
  }
  .rangewrap input{
    position:absolute;left:0;top:0;width:100%;height:30px;margin:0;padding:0;
    background:none;pointer-events:none;-webkit-appearance:none;appearance:none;
  }
  .rangewrap input:focus{outline:none;}
  .rangewrap input::-webkit-slider-runnable-track{height:30px;background:none;}
  .rangewrap input::-moz-range-track{height:30px;background:none;}
  .rangewrap input::-webkit-slider-thumb{
    -webkit-appearance:none;pointer-events:auto;cursor:ew-resize;
    width:15px;height:26px;border-radius:6px;margin-top:2px;
    background:
      linear-gradient(90deg,transparent 5px,rgba(0,0,0,.35) 5px 6px,transparent 6px,
                      transparent 9px,rgba(0,0,0,.35) 9px 10px,transparent 10px),
      linear-gradient(180deg,#9fb4fb,var(--accent));
    border:1.5px solid #0b0d11;box-shadow:0 2px 8px -2px rgba(0,0,0,.8);
  }
  .rangewrap input::-moz-range-thumb{
    pointer-events:auto;cursor:ew-resize;width:13px;height:24px;border-radius:6px;
    background:var(--accent);border:1.5px solid #0b0d11;
  }
  .rangewrap input::-webkit-slider-thumb:hover{filter:brightness(1.15);}
  .scrub{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    font-size:.74rem;margin-top:6px;font-variant-numeric:tabular-nums;
  }
  .scrub .edge{color:var(--soft);}
  .scrub .now{
    display:inline-flex;align-items:center;gap:8px;color:var(--soft);
  }
  .scrub .now.set{color:var(--ink);}
  .scrub .now b{color:var(--accent);font-weight:650;}
  .scrub button{
    background:none;border:1px solid var(--line-2);color:var(--mid);border-radius:7px;
    font:inherit;font-size:.71rem;padding:3px 9px;cursor:pointer;
  }
  .scrub button:hover{border-color:var(--accent-dim);color:var(--ink);}

  /* ---- scoreboard ---- */
  .filter{
    width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:10px 13px;font:inherit;font-size:.88rem;margin-bottom:8px;
  }
  .filter::placeholder{color:var(--soft);}
  .filter:focus{outline:none;border-color:var(--accent-dim);background:rgba(0,0,0,.4);}
  .exsum{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    color:var(--mid);font-size:.75rem;margin:0 0 10px;
  }
  .exsum button{
    background:none;border:none;color:var(--accent);font:inherit;font-size:.75rem;
    cursor:pointer;padding:0;text-decoration:underline;white-space:nowrap;
  }

  /* Fifteen names pushed the rest of the report off the screen. Five is
     enough to see the shape of the fight; the rest are a scroll away. */

  /* Someone who took a real bite out of you should be findable at a glance in
     a fifteen-name list, without reading a single number. */
  .tag{
    display:inline-flex;align-items:center;vertical-align:-3px;margin-left:7px;
    border-radius:8px;padding:2px;
  }
  .tag svg{display:block;}
  .tag.danger{color:var(--in);background:rgba(239,90,82,.14);border:1px solid rgba(239,90,82,.4);}
  .tag.hard{color:var(--accent);background:rgba(109,140,245,.13);border:1px solid var(--accent-dim);}
  .half.r .fill{background:linear-gradient(90deg,var(--out),rgba(63,191,120,.45));}
  .ex:hover{color:var(--in);background:rgba(239,90,82,.1);border-color:rgba(239,90,82,.28);}
  .ex:focus-visible{opacity:1;outline:2px solid var(--accent);outline-offset:1px;}

  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .dhead .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;}
  .dhead .av svg{width:23px;height:23px;}
  .dhead .nm{font-size:1.02rem;font-weight:700;}
  .dhead .sum{font-size:.76rem;color:var(--soft);margin-top:2px;}
  .dhead .sum .t{color:var(--in);} .dhead .sum .d{color:var(--out);}

  .detail{padding:0 2px 4px;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th{font-size:.62rem;text-transform:uppercase;letter-spacing:.11em;color:var(--soft);
     font-weight:600;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);}
  td{padding:7px 9px;border-top:1px solid rgba(255,255,255,.045);color:var(--mid);}
  td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}
  td.n.out{color:var(--out);} td.n.in{color:var(--in);}
  td.who{color:var(--ink);}
  .chip{display:inline-block;font-size:.66rem;color:var(--mid);border:1px solid var(--line-2);
        border-radius:5px;padding:1px 6px;margin-right:4px;}

  /* ---- stat pills ---- */
  .parts{display:flex;flex-wrap:wrap;gap:9px;}
  .part{
    display:flex;align-items:baseline;gap:9px;
    background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:11px;
    padding:10px 14px;font-size:.79rem;color:var(--mid);
  }
  .part b{font-variant-numeric:tabular-nums;color:var(--ink);font-size:.92rem;font-weight:700;}
  .part.main{background:linear-gradient(180deg,rgba(63,191,120,.12),rgba(63,191,120,.04));
             border-color:rgba(63,191,120,.3);}
  .part.main b{color:var(--out);}
  .part.parry{background:linear-gradient(180deg,rgba(239,90,82,.13),rgba(239,90,82,.04));
              border-color:rgba(239,90,82,.34);}
  .part.parry b{color:var(--in);}
  .part.handle{background:linear-gradient(180deg,rgba(251,146,60,.13),rgba(251,146,60,.04));
               border-color:rgba(251,146,60,.34);}
  .part.handle b{color:#fb923c;}
  /* The three duel stats keep the colours they wear on the chart, so the same
     thing is the same colour wherever you meet it. */
  .part.counter{background:linear-gradient(180deg,rgba(255,199,74,.13),rgba(255,199,74,.04));
                border-color:rgba(255,199,74,.34);}
  .part.counter b{color:var(--gold);}
  .part.good{background:linear-gradient(180deg,rgba(63,191,120,.12),rgba(63,191,120,.04));
             border-color:rgba(63,191,120,.3);}
  .part.good b{color:var(--out);}
  .part.bad{background:linear-gradient(180deg,rgba(239,90,82,.13),rgba(239,90,82,.04));
            border-color:rgba(239,90,82,.34);}
  .part.bad b{color:var(--in);}
  .part.ability{background:linear-gradient(180deg,rgba(167,139,250,.14),rgba(167,139,250,.04));
                border-color:rgba(167,139,250,.36);}
  .part.ability b{color:#a78bfa;}
  .part.armor{background:linear-gradient(180deg,rgba(148,163,184,.12),rgba(148,163,184,.03));
              border-color:rgba(148,163,184,.3);}
  .part.armor b{color:#94a3b8;}
  .prow{display:flex;flex-wrap:wrap;gap:9px;flex-basis:100%;}
  .prow + .prow{margin-top:9px;}

  /* Counter-reducing a hit is rare -- two of them across four fights -- so it
     gets the top row and is dressed to look like something you pulled off. */
  .part.trophy{
    align-items:center;gap:18px;padding:19px 26px;
    padding:15px 20px;border-color:var(--accent);
    background:
      linear-gradient(135deg,rgba(109,140,245,.24),rgba(109,140,245,.07) 55%,transparent),
      var(--panel-2);
    box-shadow:0 0 46px -14px rgba(109,140,245,.55), inset 0 1px 0 rgba(255,255,255,.09);
  }
  .part.trophy .lbl{
    display:flex;align-items:center;gap:9px;
    font-size:.94rem;text-transform:none;letter-spacing:.01em;
    color:var(--accent);font-weight:700;
  }
  .part.trophy .lbl::before{content:"\25c6";font-size:.86rem;opacity:.9;}
  .part.trophy b{
    font-size:1.75rem;line-height:1;color:var(--accent);
    text-shadow:0 0 28px rgba(109,140,245,.65);
  }
  .part.magic b{color:var(--magic);}

  /* Three readings of the same duel, so they share a shape and differ only in
     colour: what your counter blunted, what you turned away, what they did. */
  .duel{
    flex:1;min-width:150px;display:grid;
    grid-template-columns:1fr auto;align-items:baseline;gap:4px 12px;
    padding:15px 18px;cursor:pointer;text-align:left;
    background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:11px;
    transition:border-color .12s,background .12s;
  }
  .duel .lbl{font-size:.78rem;color:var(--mid);}
  .duel b{font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums;}
  .duel .who{
    grid-column:1 / -1;font-size:.7rem;color:var(--soft);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .duel.counter b{color:var(--gold);text-shadow:0 0 14px var(--gold-halo);}
  .duel.good b{color:var(--out);}
  .duel.bad b{color:var(--in);}
  .duel:hover{background:rgba(255,255,255,.05);border-color:var(--line-2);}
  .duel.on{background:rgba(109,140,245,.1);border-color:var(--accent-dim);}
  .duel.counter.on{background:rgba(255,199,74,.1);border-color:rgba(255,199,74,.45);}
  .duel.good.on{background:rgba(63,191,120,.1);border-color:rgba(63,191,120,.45);}
  .duel.bad.on{background:rgba(239,90,82,.1);border-color:rgba(239,90,82,.45);}
  .duel.on .lbl{color:var(--ink);}
  .duel.zero{opacity:.45;}
  .duel.zero b{color:var(--soft);}
  /* Present but not achieved: still readable, no longer shouting. */
  .part.zero{opacity:.45;}
  .part.zero b{color:var(--soft);}
  .part.trophy.zero{
    background:var(--panel-2);border-color:var(--line-2);box-shadow:none;opacity:1;
  }
  .part.trophy.zero .lbl{color:var(--soft);}
  .part.trophy.zero b{color:var(--soft);text-shadow:none;}
  .part.heal b{color:var(--heal);}
  .note,.who{color:var(--soft);font-size:.78rem;margin:14px 0 0;line-height:1.6;}
  .who b{color:var(--ink);font-weight:650;}

  .empty{color:var(--soft);text-align:center;padding:38px 0;font-size:.9rem;}

  @media(max-width:860px){
    .lead-grid{grid-template-columns:1fr;}
    .picks{order:2;}
  }
  @media(max-width:760px){
    .totals{grid-template-columns:1fr;}
    .strip{gap:16px;}
    .rank,.bars{display:none;}
  }

  /* Last, so it beats the display rule on whatever it is hiding. */
  .hide{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Mortal Online 2 &middot; Fight Report</p>
  <h1 id="title">MO2 VOD Review</h1>
  <div class="meta" id="meta"></div>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".json">
    <b>Drop a fight.json here</b>
    <span>or click to choose one</span>
  </label>

  <div id="app" class="hide">
    <div class="strip" id="totals"></div>

    <div class="card lead">
      <div class="lead-grid">
        <aside class="picks">
          <h2>Players</h2>
          <div class="rosterlist" id="roster"></div>
          <div class="exsum" id="exsum"></div>
        </aside>
        <div class="chart">
          <h2>How the fight went <span class="focusnote" id="focusnote"></span></h2>
          <div class="chartwrap" id="chartwrap">
            <div class="plot">
              <div class="ylab" id="ylab"></div>
              <div class="tl" id="tl">
                <svg id="svg" preserveAspectRatio="none"></svg>
              </div>
            </div>
            <div class="xaxis" id="xaxis"></div>
            <div class="lanes" id="duel"></div>
            <div class="tip" id="tip"></div>
          </div>
          <div class="rangewrap">
            <div class="rail"><div class="sel" id="sel"></div></div>
            <input type="range" id="r0" min="0" max="100" value="0"
                   aria-label="Start of the stretch to show">
            <input type="range" id="r1" min="0" max="100" value="100"
                   aria-label="End of the stretch to show">
          </div>
          <div class="scrub">
            <span class="edge">0:00</span>
            <span class="now" id="tnow"></span>
            <span class="edge" id="tend">0:00</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card" id="detailcard">
      <h2 id="detailhead">Pick a player</h2>
      <div id="detail"></div>
    </div>

    <div class="card">
      <h2>How hits landed</h2>
      <div class="parts" id="parts"></div>
      <p class="note" id="defnote"></p>
    </div>

    <div class="card" id="spellcard">
      <h2>Magic &amp; healing</h2>
      <div class="parts" id="spells"></div>
      <p class="who" id="healwho"></p>
    </div>
  </div>
</div>

<script>
let DATA = null;
let DUR = 1;
let T0 = 0, T1 = 0;

/* MO2 tags each line with where it landed, plus what happened to it. Only the
   first group is a location. Parry and Blocked are outcomes -- the swing
   connected with nothing. Sting is a weapon proc on an ordinary hit, so it is
   deliberately not called out as anything special. */
const BODY = ['Head','Torso','Right Limb','Left Limb','Lower Body'];
const NORMAL = ['Sting'];
// What actually happened to the swing. Where it landed matters far less than
// whether it landed at all, so these get counted on their own.
const OUTCOMES = ['Parry','Blocked','Equipment','Handle'];
const isBody = f => BODY.includes(f);
const isNoise = f => NORMAL.includes(f);
const isOutcome = f => OUTCOMES.includes(f);

/* ---------------- loading ---------------- */
window.addEventListener('DOMContentLoaded', () => {
  if (window.__BAKED__) { DATA = window.__BAKED__; start(); }
});
const drop = document.getElementById('drop');
document.getElementById('file').addEventListener('change',
  e => e.target.files[0] && read(e.target.files[0]));
['dragenter','dragover'].forEach(n => drop.addEventListener(n, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave','drop'].forEach(n => drop.addEventListener(n, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) read(f); });

function read(f){
  const r = new FileReader();
  r.onload = () => {
    try { DATA = JSON.parse(r.result); } catch { alert('That is not valid JSON.'); return; }
    if (!DATA.events) { alert('No events in that file.'); return; }
    start();
  };
  r.readAsText(f);
}

/* ---------------- helpers ---------------- */
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const foe = e => e.dir === 'out' ? e.target : e.who;

/* Opponents taken out of the totals. Their row stays put, greyed, so you can
   see what you set aside and put it back. */
const EXCLUDED = new Set();
// One name at a time, to see just their exchange against the whole fight.
let FOCUS = null;
// A second way to read the chart: not "who", but "what happened". A set, so
// the three can be asked about together -- they are different kinds of moment
// and there is no reason wanting one should mean giving up another. Kept apart
// from FOCUS, which asks about a player, so the chart answers one question.
const HILITE = new Set();
const inWindow = e => e.t >= T0 && e.t <= T1;
const isHit = e => (e.kind || 'hit') === 'hit';
const isHeal = e => e.kind === 'heal';
// An ability that is not a weapon is a spell: "arrow" is a bow, "Corrupt" is not.
const WEAPONS = ['arrow','arrows','bolt','bolts','dagger','sword','axe','mace',
                 'spear','javelin','hammer','bow','blade','lance','club','staff',
                 'knife','pike','halberd','shield','fist','fists'];
const isMagic = e => isHit(e) && e.ability && !WEAPONS.includes(e.ability.toLowerCase());
const counted = () => DATA.events.filter(e => inWindow(e) && !EXCLUDED.has(foe(e)));

function start(){
  drop.classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  const name = (DATA.source || 'Fight').replace(/\.[^.]+$/, '');
  const title = document.getElementById('title');
  if (DATA.source_path){
    // Opening a local file from a local page is allowed; from a page served
    // over http it is not, so fall back to plain text rather than a dead link.
    const href = encodeURI('file:///' + DATA.source_path.replace(/\\/g, '/'));
    // A new tab, so the report you were reading is still there behind it.
    title.innerHTML = `<a class="clip" href="${href}" target="_blank" rel="noopener"` +
      ` title="Play the clip">${esc(name)}` +
      `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" ` +
      `stroke-width="2" stroke-linecap="round" stroke-linejoin="round">` +
      `<path d="M5 4.6 19 12 5 19.4z"/></svg></a>`;
    // Inside the app this page is handed to the view as text, so it has no
    // address to resolve a local file against and the link above goes
    // nowhere. Ask the app to play it instead; on its own in a browser the
    // link works and this does nothing.
    const link = title.querySelector('a.clip');
    if (link && window.parent !== window) {
      link.addEventListener('click', e => {
        e.preventDefault();
        window.parent.postMessage(
          {mo2: 'play-clip', path: DATA.source_path}, '*');
      });
    }
  } else {
    title.textContent = name;
  }
  DUR = Math.max(DATA.duration || 0, ...DATA.events.map(e => e.t), 1);
  document.getElementById('meta').innerHTML =
    [fmt(DUR), `${DATA.events.length} events`, `${(DATA.players||[]).length} players`]
      .map(t => `<span>${esc(t)}</span>`).join('');
  T0 = 0; T1 = DUR;
  document.getElementById('tend').textContent = fmt(DUR);

  const r0 = document.getElementById('r0'), r1 = document.getElementById('r1');
  // A step derived from the duration cannot land exactly on it, which leaves
  // the right handle short of the end so the fight never reads as whole.
  [r0, r1].forEach(r => { r.max = DUR; r.step = 'any'; });
  r0.value = 0; r1.value = DUR;
  const slide = () => {
    let a = +r0.value, b = +r1.value;
    if (a > b) { [a, b] = [b, a]; }   // handles may cross; treat it as a window
    T0 = a; T1 = b;
    render();
  };
  r0.addEventListener('input', slide);
  r1.addEventListener('input', slide);
  timelineTip();
  // The marks are sized against the chart's own width, so a resize has to
  // redraw them or they drift back into ovals.
  window.addEventListener('resize', timeline);
  render();
}

function render(){ totals(); roster(); detail(); duel(); parts(); spells(); excluded(); timeline(); }

function spells(){
  const ev = counted();
  const magic = ev.filter(isMagic);
  const heal = ev.filter(isHeal);
  document.getElementById('spellcard').classList.remove('hide');

  const sum = (a, d) => a.filter(e => e.dir === d).reduce((s, e) => s + e.amount, 0);
  const cnt = (a, d) => a.filter(e => e.dir === d).length;
  // How many casts it took does not matter; the total does.
  const box = (label, v, cls) =>
    `<span class="part ${cls}${v ? '' : ' zero'}">${label}<b>${v}</b></span>`;

  document.getElementById('spells').innerHTML =
    `<div class="prow">${box('Spell damage given',    sum(magic, 'out'), 'magic')}${
                        box('Spell damage received', sum(magic, 'in'),  'magic')}</div>` +
    `<div class="prow">${box('Healing given',         sum(heal,  'out'), 'heal')}${
                        box('Healing received',      sum(heal,  'in'),  'heal')}</div>`;

  // Who was on each end of it -- the point of tracking healing at all.
  const by = (a, k) => {
    const t = {};
    a.forEach(e => { const n = e[k]; if (n && n !== 'You') t[n] = (t[n] || 0) + e.amount; });
    return Object.entries(t).sort((x, y) => y[1] - x[1])
      .map(([n, v]) => `<b>${esc(n)}</b> ${v}`).join(', ');
  };
  const lines = [];
  const got = by(heal.filter(e => e.dir === 'in'), 'who');
  const gave = by(heal.filter(e => e.dir === 'out'), 'target');
  if (got)  lines.push('Healed by ' + got + '.');
  if (gave) lines.push('You healed ' + gave + '.');
  // "Spells seen: Corrupt" tells you nothing about who was casting it.
  const cast = by(magic.filter(e => e.dir === 'in'), 'who');
  const hitBy = by(magic.filter(e => e.dir === 'out'), 'target');
  if (cast)  lines.push('Spell damage from ' + cast + '.');
  if (hitBy) lines.push('Your spells hit ' + hitBy + '.');
  const spellNames = [...new Set(magic.map(e => e.ability))].filter(Boolean);
  if (spellNames.length) lines.push('Spells: ' + spellNames.map(esc).join(', ') + '.');
  document.getElementById('healwho').innerHTML = lines.join(' ');
}

function excluded(){
  const el = document.getElementById('exsum');
  if (!EXCLUDED.size){ el.innerHTML = ''; return; }
  const names = [...EXCLUDED];
  el.innerHTML = `<span>Not counted: ${names.map(esc).join(', ')}</span>
    <button id="clearex">count everyone</button>`;
  document.getElementById('clearex').addEventListener('click', () => {
    EXCLUDED.clear(); render();
  });
}

// The rail beneath the chart: where the window sits within the whole fight,
// and the way back out of it. The chart itself is now redrawn to fit the
// window rather than shaded over, so this rail is the only thing left that
// still has to describe the entire duration -- without it, a zoomed chart
// gives you no sense of which part of the fight you are looking at.
function windowBar(){
  const whole = T0 <= 0.05 && T1 >= DUR - 0.05;
  const sel = document.getElementById('sel');
  if (sel){
    sel.style.left  = (T0 / DUR) * 100 + '%';
    sel.style.width = ((T1 - T0) / DUR) * 100 + '%';
  }
  // Say what the control does while it is untouched, and what it is doing
  // once it has been -- "whole fight" alone explained neither.
  const now = document.getElementById('tnow');
  now.classList.toggle('set', !whole);
  now.innerHTML = whole
    ? 'Drag either handle to zoom into part of the fight'
    : `Showing <b>${fmt(T0)} – ${fmt(T1)}</b><button id="reset">whole fight</button>`;
  const resetBtn = document.getElementById('reset');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    const a = document.getElementById('r0'), b = document.getElementById('r1');
    a.value = 0; b.value = DUR; a.dispatchEvent(new Event('input'));
  });
}

/* ---------------- timeline ---------------- */

// A hundred damage inside six seconds. Held flat on purpose: it means the same
// thing in every fight, so a burst in one recording is comparable to a burst in
// another. Across four clips the worst six seconds ran 39, 80, 168 and 171, so
// this marks the two that were genuinely dangerous and leaves the rest alone.
const BURST_SPAN = 6.0;
const BURST_DMG = 100;

function bursts(){
  const inc = DATA.events
    .filter(e => isHit(e) && e.dir === 'in' && !EXCLUDED.has(e.who))
    .sort((a, b) => a.t - b.t);

  const hot = [];
  for (let i = 0; i < inc.length; i++){
    let sum = 0, end = inc[i].t;
    for (let j = i; j < inc.length && inc[j].t - inc[i].t <= BURST_SPAN; j++){
      sum += inc[j].amount; end = inc[j].t;
    }
    if (sum >= BURST_DMG) hot.push({from: inc[i].t, to: end, dmg: sum});
  }
  // Overlapping windows describe one bad moment, not several.
  const out = [];
  hot.forEach(h => {
    const last = out[out.length - 1];
    if (last && h.from <= last.to){
      last.to = Math.max(last.to, h.to);
      last.dmg = Math.max(last.dmg, h.dmg);
    } else out.push({...h});
  });
  return out;
}

// Drawn from exactly the events the numbers above it are counting, so moving a
// handle or setting someone aside redraws the chart instead of shading part of
// it out. Both axes follow: the window fills the width, and the height is
// scaled to the tallest bar still on screen. Shading kept the old scale, which
// meant zooming into a quiet stretch left it flat against the axis and taking
// the heaviest hitter out left everyone else squashed under a peak that was no
// longer there.
// Gridlines want round numbers -- ones a person would have chosen.
function niceStep(reach, lines){
  const raw = Math.max(reach, 1) / Math.max(lines, 1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}

// Bars for the swings, two faint lines for the running totals behind them.
// The bars answer "how hard, and who", which is what you look at a fight for;
// the lines carry the momentum underneath without competing for attention.
//
// The two are on different scales on purpose. A single hit tops out around
// eighty and a fight's total runs to thousands, so one scale would flatten
// every bar to nothing. The labelled axis is the bars' -- it is the one you
// read values off -- and the lines are shape rather than quantity.
function timeline(){
  const svg = document.getElementById('svg');
  const W = 1000, H = 200, mid = H / 2, cap = mid - 10;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const span = Math.max(T1 - T0, 0.001);
  const X = t => ((t - T0) / span) * W;
  const idxOf = new Map(DATA.events.map((e, i) => [e, i]));
  const shown = counted().filter(isHit);

  // The axis is the size of a single hit, out above and in below.
  const peak = Math.max(1, ...shown.map(e => e.amount));
  const step = niceStep(peak, 3);
  const top = Math.ceil(peak / step) * step;
  const L = a => Math.max(2.5, (a / top) * cap);   // a parry does nothing, but happened

  let grid = '';
  for (let v = -top; v <= top + 1e-6; v += step){
    const zero = Math.abs(v) < 1e-6, y = (mid - (v / top) * cap).toFixed(1);
    grid += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line${zero ? '-2' : ''})"
             stroke-width="1" opacity="${zero ? '1' : '.5'}"></line>`;
  }

  // Running totals, each on its own side, scaled to whichever ran higher so
  // the two stay comparable with each other.
  const sorted = shown.slice().sort((a, b) => a.t - b.t);
  let co = 0, ci = 0;
  const cum = sorted.map(e => {
    if (e.dir === 'out') co += e.amount; else ci += e.amount;
    return {t: e.t, o: co, i: ci};
  });
  const cpeak = Math.max(co, ci, 1);
  const CY = (v, up) => up ? mid - (v / cpeak) * cap : mid + (v / cpeak) * cap;
  const path = (sel, up) => {
    if (!cum.length) return '';
    let d = `M ${X(T0).toFixed(1)} ${mid}`;
    cum.forEach(p => { d += ` L ${X(p.t).toFixed(1)} ${CY(sel(p), up).toFixed(1)}`; });
    return d + ` L ${X(T1).toFixed(1)} ${CY(sel(cum[cum.length - 1]), up).toFixed(1)}`;
  };

  // A picked hit takes the colour of the lane that picked it, so with all
  // three on you get gold, green and red side by side and can still tell which
  // was which.
  const TONE_VAR = {counter: 'gold', good: 'out', bad: 'in'};
  let bars = '';
  DATA.events.forEach((e, i) => {
    if (!inWindow(e) || EXCLUDED.has(foe(e)) || !isHit(e)) return;
    const pick = duelPick(e);
    const lit = (!FOCUS || foe(e) === FOCUS) && (!HILITE.size || !!pick);
    const tone = pick ? TONE_VAR[pick.tone] : (e.dir === 'out' ? 'out' : 'in');
    const up = e.dir === 'out', h = L(e.amount), x = X(e.t);
    const w = pick && lit ? 7 : 5;
    bars += `<rect x="${(x - w / 2).toFixed(1)}" y="${(up ? mid - h : mid).toFixed(1)}"
      width="${w}" height="${h.toFixed(1)}" rx="1.5" fill="var(--${tone})"
      opacity="${lit ? '.92' : '.1'}" data-i="${i}"></rect>`;
  });

  const bands = bursts()
    .filter(b => b.to >= T0 && b.from <= T1)
    .map(b => {
      const x1 = X(Math.max(b.from, T0));
      const x2 = Math.max(X(Math.min(b.to, T1)), x1 + 5);
      return `<rect x="${x1.toFixed(1)}" y="0" width="${(x2 - x1).toFixed(1)}" height="${H}"
              fill="var(--in)" opacity=".07"></rect>`;
    }).join('');

  svg.innerHTML =
    `<g>${bands}</g>
     <g>${grid}</g>
     <path d="${path(p => p.o, true)}"  fill="none" stroke="var(--out)"
           stroke-width="1.5" opacity=".38"></path>
     <path d="${path(p => p.i, false)}" fill="none" stroke="var(--in)"
           stroke-width="1.5" opacity=".38"></path>
     <g id="hits">${bars}</g>`;

  // Mirrored: the number is the size of a hit, and the side says whose.
  let yl = '';
  for (let v = top; v >= -top - 1e-6; v -= step){
    yl += `<span style="top:${(((mid - (v / top) * cap) / H) * 100).toFixed(2)}%">${
      Math.round(Math.abs(v))}</span>`;
  }
  document.getElementById('ylab').innerHTML = yl;

  let xl = '';
  for (let i = 0; i <= 5; i++){
    xl += `<span style="left:${i * 20}%">${fmt(T0 + span * i / 5)}</span>`;
  }
  document.getElementById('xaxis').innerHTML = xl;

  windowBar();
}

// Bound once, not per redraw: the chart is rebuilt on every drag, and
// re-binding with it stacked a fresh pair of listeners on each one.
function timelineTip(){
  const wrap = document.getElementById('chartwrap');
  const tip  = document.getElementById('tip');

  // One handler over the whole chart area: the vertices live in the SVG and
  // the duel marks live in the lane below it, and both want the same tooltip.
  wrap.addEventListener('mousemove', ev2 => {
    const t = ev2.target;
    const mark = t.tagName === 'I' && t.dataset.i ? t : null;
    const dot  = t.tagName === 'rect' && t.dataset.i ? t : null;
    const node = mark || dot;
    if (!node) { tip.style.opacity = 0; return; }
    const e = DATA.events[+node.dataset.i];

    if (mark){
      // The mark alone says only that something happened here. The time is
      // what you need to go and find it in the recording.
      const d = DUEL.find(x => x.k === mark.dataset.mk);
      tip.innerHTML = `${fmt(e.t)} &nbsp; ${esc(d ? d.tip : 'Marked')}
        <b>${esc(foe(e))}</b>` + (e.amount ? ` for <b>${e.amount}</b>` : '');
    } else {
      const where = (e.flags||[]).filter(f => !isNoise(f));
      tip.innerHTML = `${fmt(e.t)} &nbsp; ${e.dir==='out' ? 'you hit' : 'hit by'}
        <b>${esc(foe(e))}</b> for <b>${e.amount}</b>` +
        (where.length ? ` · ${esc(where.join(', '))}` : '');
    }

    const box = wrap.getBoundingClientRect();
    // A mark in the lane is near the bottom, so its tooltip hangs above; a
    // vertex can sit anywhere, and above the cursor is out of its own way.
    tip.classList.remove('below');
    tip.style.left = (ev2.clientX - box.left) + 'px';
    tip.style.top  = (ev2.clientY - box.top - 10) + 'px';
    tip.style.opacity = 1;
  });
  wrap.addEventListener('mouseleave', () => tip.style.opacity = 0);
}


/* ---------------- headline ---------------- */
function totals(){
  const ev = counted().filter(isHit);
  const out = ev.filter(e => e.dir==='out'), inc = ev.filter(e => e.dir==='in');
  const o = out.reduce((s,e)=>s+e.amount,0), i = inc.reduce((s,e)=>s+e.amount,0);
  const avg = a => a.length ? Math.round(a.reduce((s,e)=>s+e.amount,0)/a.length) : 0;
  document.getElementById('totals').innerHTML = `
    <div class="dealt"><span class="k">Dealt</span><b>${o.toLocaleString()}</b>
      <span class="sub">${out.length} hits, ${avg(out)} avg</span></div>
    <div class="taken"><span class="k">Taken</span><b>${i.toLocaleString()}</b>
      <span class="sub">${inc.length} hits, ${avg(inc)} avg</span></div>
    <div class="net"><span class="k">Net</span><b>${o-i>=0?'+':''}${(o-i).toLocaleString()}</b>
      <span class="sub">${i ? (o/i).toFixed(1)+'\u00d7 traded' : 'took nothing'}</span></div>`;
}

/* ---------------- how a player is drawn ---------------- */

// Placeholder avatars, in the spirit of a chat app's default: a flat colour
// and a plain bust. Fixed by the name, so a player looks the same in every
// report you open.
const AVATAR_BG = ['#5865f2', '#747f8d', '#3ba55c', '#faa81a', '#ed4245', '#eb459e'];

function nameHash(name){
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return h;
}
function tint(name){
  return AVATAR_BG[nameHash(name) % AVATAR_BG.length];
}
function mark(){
  return '<svg viewBox="0 0 24 24" width="21" height="21" fill="#fff" aria-hidden="true">' +
    '<circle cx="12" cy="8.6" r="4.1"/>' +
    '<path d="M12 14.1c-3.9 0-7 2.4-7 5.4v1.2h14v-1.2c0-3-3.1-5.4-7-5.4z"/></svg>';
}

const SKULL = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" ' +
  'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M12 2.4c4.5 0 7.8 3.1 7.8 7.3 0 2.7-1.3 4.2-2.5 5.2v3.4c0 1-.9 1.9-1.9 1.9H8.6' +
  'c-1 0-1.9-.9-1.9-1.9v-3.4c-1.2-1-2.5-2.5-2.5-5.2 0-4.2 3.3-7.3 7.8-7.3z"/>' +
  '<circle cx="9.1" cy="10.4" r="1.6"/><circle cx="14.9" cy="10.4" r="1.6"/>' +
  '<path d="M10.6 15.4v2.6M13.4 15.4v2.6"/></svg>';

const BLADE = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" ' +
  'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M12 2.2 12 15M8.6 14.6h6.8M12 15.4v3.2"/>' +
  '<circle cx="12" cy="20.4" r="1.6"/></svg>';

// One line, both ways: 150 is where someone stopped being incidental to the
// fight. The glyph says which side of it they were on; the number is a
// tooltip, because the row already carries it.
const HURT = 150;

const HIDE_ICON = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" ' +
  'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M3.2 3.2 20.8 20.8"/>' +
  '<path d="M10.7 5.2A8.7 8.7 0 0 1 12 5.1c5 0 9 4.4 9 6.9 0 .9-.5 2-1.4 3.1"/>' +
  '<path d="M6.6 6.9C4.4 8.3 3 10.2 3 12c0 2.5 4 6.9 9 6.9 1.5 0 2.9-.4 4.1-1"/>' +
  '<path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

function threat(dealtToYou, youDealt){
  if (dealtToYou >= HURT)
    return `<span class="tag danger" title="They put ${dealtToYou} through you">${SKULL}</span>`;
  if (youDealt >= HURT)
    return `<span class="tag hard" title="You put ${youDealt} through them">${BLADE}</span>`;
  return '';
}

/* ---------------- the fight's headline players ---------------- */
// Ranked the same way the scoreboard is, so the shortlist and the full list
// never disagree about who mattered.
function involvement(){
  const by = {};
  DATA.events.filter(e => inWindow(e) && isHit(e)).forEach(e => {
    const n = foe(e);
    if (!n) return;
    const d = (by[n] = by[n] || {dealt: 0, taken: 0, rows: []});
    d[e.dir === 'out' ? 'dealt' : 'taken'] += e.amount;
    d.rows.push(e);
  });
  return by;
}

function roster(){
  const by = involvement();
  // Everyone stays in the list whether or not they count. A name that
  // vanished when you clicked it left you guessing what you had done and
  // where it went; greyed out with its eye lit, the state is on the row.
  const names = Object.keys(by)
    .sort((x, y) => (by[y].dealt + by[y].taken) - (by[x].dealt + by[x].taken));

  const el = document.getElementById('roster');
  if (!names.length){
    el.innerHTML = '<div class="empty">Nobody in this stretch.</div>';
    return;
  }
  const peak = Math.max(1, ...names.map(n => Math.max(by[n].dealt, by[n].taken)));

  el.innerHTML = names.map(n => {
    const d = by[n];
    const off = EXCLUDED.has(n);
    return `<div class="rrow${off ? ' off' : ''}">
      <button class="pick${FOCUS === n ? ' on' : ''}" data-p="${esc(n)}">
        <span class="av" style="background:${tint(n)}">${mark()}</span>
        <span class="nm">${esc(n)}${threat(d.taken, d.dealt)}</span>
        <span class="amt"><span class="${d.taken ? 't' : 'z'}">${d.taken || '—'}</span>
          <span class="z">/</span> <span class="${d.dealt ? 'd' : 'z'}">${d.dealt || '—'}</span></span>
        <span class="minibar">
          <span class="half l"><span class="fill" style="width:${(d.taken / peak) * 100}%"></span></span>
          <span class="spine"></span>
          <span class="half r"><span class="fill" style="width:${(d.dealt / peak) * 100}%"></span></span>
        </span>
      </button>
      <button class="ex" data-x="${esc(n)}" aria-pressed="${off}"
              title="${off ? 'Count ' + esc(n) + ' again' : 'Stop counting ' + esc(n)}"
        >${HIDE_ICON}</button>
    </div>`;
  }).join('');

  el.querySelectorAll('.pick').forEach(b =>
    b.addEventListener('click', () => setFocus(b.dataset.p)));
  el.querySelectorAll('.ex').forEach(b => b.addEventListener('click', () => {
    const n = b.dataset.x;
    if (EXCLUDED.has(n)) EXCLUDED.delete(n);
    else { EXCLUDED.add(n); if (FOCUS === n) FOCUS = null; }
    render();
  }));
}

/* ---------------- the selected player ---------------- */
function detail(){
  const head = document.getElementById('detailhead');
  const el = document.getElementById('detail');
  const by = involvement();

  const card = document.getElementById('detailcard');
  card.classList.remove('hide');
  if (!FOCUS || !by[FOCUS]){
    head.textContent = 'Pick a player';
    el.innerHTML = '<div class="empty">Choose someone beside the chart to see every hit ' +
                   'between you, and to pick them out of the timeline.</div>';
    return;
  }
  const d = by[FOCUS], hits = d.rows.length;
  head.textContent = 'Every hit';
  el.innerHTML = `<div class="dhead">
      <span class="av" style="background:${tint(FOCUS)}">${mark()}</span>
      <span>
        <span class="nm">${esc(FOCUS)}${threat(d.taken, d.dealt)}</span>
        <span class="sum">${hits} hit${hits === 1 ? '' : 's'} &middot;
          you dealt <span class="d">${d.dealt}</span> &middot;
          they dealt <span class="t">${d.taken}</span></span>
      </span>
    </div>` + table(d.rows);
}

// One place decides who is highlighted, so the shortlist, the scoreboard and
// the chart cannot drift out of step.
function setFocus(n){
  FOCUS = (FOCUS === n) ? null : n;
  if (FOCUS) HILITE.clear();
  document.getElementById('focusnote').textContent = FOCUS ? `showing ${FOCUS}` : '';
  roster();
  detail();
  duel();
  timeline();
}

function table(rows){
  const body = rows.slice().sort((a,b)=>a.t-b.t).map(r => {
    const flags = (r.flags||[]).filter(f => !isNoise(f));
    const where = flags.filter(isBody);
    const how   = flags.filter(f => !isBody(f));
    return `<tr>
      <td class="num">${fmt(r.t)}</td>
      <td class="who">${r.dir==='out' ? 'you hit' : 'hit you'}</td>
      <td class="n ${r.dir}">${r.amount}</td>
      <td>${esc(where.join(', ')) || '—'}</td>
      <td>${how.map(m => `<span class="chip">${esc(m)}</span>`).join('')}</td>
    </tr>`;
  }).join('');
  return `<table><thead><tr>
    <th>time</th><th></th><th style="text-align:right">dmg</th><th>where</th><th></th>
  </tr></thead><tbody>${body}</tbody></table>`;
}

/* ---------------- parries and counters ---------------- */

// The three moments worth finding again: a swing of theirs your counter blunted,
// a swing of theirs you turned away, and one of yours they turned away.
// `tip` is how the moment reads on the chart, where the button's label is no
// longer next to it: "Parry given" makes sense under a heading, but a mark
// hanging over one instant wants to name what happened and who it was.
const DUEL = [
  {k: 'counter', label: 'Counter reduced', tone: 'counter',
   tip: 'Counter reduced a hit from',
   test: e => e.dir === 'in'  && (e.flags || []).includes('Counter Reduced')},
  {k: 'parried', label: 'Parry received', tone: 'good',
   tip: 'Parried',
   test: e => e.dir === 'in'  && (e.flags || []).includes('Parry')},
  {k: 'gotparried', label: 'Parry given', tone: 'bad',
   tip: 'Parried by',
   test: e => e.dir === 'out' && (e.flags || []).includes('Parry')},
];

// Which selected stat this hit belongs to, if any. With several selected each
// hit still answers to exactly one of them, so it can be coloured by its own
// rather than by whichever was clicked last.
function duelPick(e){
  if (!HILITE.size || !isHit(e)) return null;
  return DUEL.find(d => HILITE.has(d.k) && d.test(e)) || null;
}

function duelMatch(e){
  return !HILITE.size || !!duelPick(e);
}

// Three silhouettes, not three colours: a chip has to be readable to someone
// who cannot tell the gold from the green. An arrow onto a floor for damage
// pushed down, a guarded shield for a swing you turned, crossed blades for one
// of yours that was turned.
const glyph = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
const DUEL_ICON = {
  counter: glyph('<path d="M12 4v8"/><path d="M8.5 8.5 12 12l3.5-3.5"/><path d="M6 17.5h12"/>'),
  parried: glyph('<path d="M12 3.4l6.3 2.7v4.5c0 3.8-2.6 7-6.3 8-3.7-1-6.3-4.2-6.3-8V6.1z"/>' +
               '<path d="M9.4 11.5l1.8 1.8 3.4-3.5"/>'),
  gotparried: glyph('<path d="M5.2 5.2 14 14"/><path d="M18.8 5.2 10 14"/>' +
                  '<path d="M4.6 19.4l2.6-2.6"/><path d="M19.4 19.4l-2.6-2.6"/>'),
};

function duel(){
  const el = document.getElementById('duel');
  const span = Math.max(T1 - T0, 0.001);
  const idxOf = new Map(DATA.events.map((e, i) => [e, i]));
  const ev = counted().filter(isHit);

  el.innerHTML = DUEL.map(d => {
    const rows = ev.filter(d.test);
    const who = {};
    rows.forEach(e => {
      const n = e.dir === 'out' ? e.target : e.who;
      if (n && n !== 'You') who[n] = (who[n] || 0) + 1;
    });
    const names = Object.entries(who).sort((a, b) => b[1] - a[1])
      .map(([n, c]) => `${n}${c > 1 ? ' ×' + c : ''}`).join(', ');
    const hint = rows.length
      ? `${d.label}: ${names || '—'}
` +
        (HILITE.has(d.k) ? 'Click to clear it from the chart'
                        : 'Click to mark these on the chart')
      : `No ${d.label.toLowerCase()} in this stretch`;

    // Positioned against the same window the chart uses, so a mark sits under
    // the moment it belongs to.
    const marks = rows.map(e =>
      `<i style="left:${(((e.t - T0) / span) * 100).toFixed(2)}%"
          data-i="${idxOf.get(e)}" data-mk="${d.k}"></i>`).join('');

    return `<button class="lane ${d.tone}${HILITE.has(d.k) ? ' on' : ''}${
        rows.length ? '' : ' zero'}" data-h="${d.k}"
        aria-pressed="${HILITE.has(d.k)}" title="${esc(hint)}"
        ${rows.length ? '' : 'disabled'}>
      <span class="lanelab">${DUEL_ICON[d.k]}${d.label}</span>
      <span class="lanetrack">${marks}</span>
      <span class="lanen">${rows.length}</span>
    </button>`;
  }).join('');

  el.querySelectorAll('.lane').forEach(b =>
    b.addEventListener('click', () => setHilite(b.dataset.h)));
}

// Asking "who" and asking "what happened" at once usually leaves an empty
// chart, so choosing one clears the other.
function setHilite(k){
  if (HILITE.has(k)) HILITE.delete(k); else HILITE.add(k);
  if (HILITE.size) FOCUS = null;
  const on = DUEL.filter(d => HILITE.has(d.k)).map(d => d.label.toLowerCase());
  document.getElementById('focusnote').textContent =
    on.length ? `showing ${on.join(', ')}` : '';
  roster(); detail(); duel(); timeline();
}

/* ---------------- how hits landed ---------------- */
// Weapon procs and ability tags. Counter Reduced is left out -- it has a stat
// of its own above -- and the outcomes below are not abilities, they are what
// stopped the swing.
const ABILITY = ['Impale', 'Armor Pierced', 'Spread Shot', 'Forceful Strike',
                 'Off-Hand', 'Sting'];

function parts(){
  const ev = counted().filter(isHit);
  const mine = ev.filter(e => e.dir === 'out');
  const zero = () => ({n: 0, dmg: 0});
  const add = (b, e) => { b.n++; b.dmg += e.amount; };

  const clean = zero(), ability = zero(), handle = zero(), armour = zero();
  const duel = {counter: zero(), parried: zero(), gotparried: zero()};

  ev.forEach(e => {
    DUEL.forEach(d => { if (d.test(e)) add(duel[d.k], e); });
    // Armour taking a hit for you is worth knowing on the way in, not out.
    if (e.dir === 'in' && (e.flags || []).includes('Equipment')) add(armour, e);
  });

  mine.forEach(e => {
    const flags = (e.flags || []).filter(f => !isNoise(f) || ABILITY.includes(f));
    const stopped = flags.filter(isOutcome);
    if (flags.some(f => f === 'Handle')) add(handle, e);
    if (stopped.length) return;              // never landed
    add(clean, e);
    // A swing can carry two tags at once; it is still one swing with abilities
    // on it, so it counts once here rather than once per tag.
    if (flags.some(f => ABILITY.includes(f))) add(ability, e);
  });

  // "1 hit · 12" leaves you guessing what 12 is. Say it.
  const chip = (label, d, cls, countOnly) =>
    `<span class="part${cls ? ' ' + cls : ''}${d.n ? '' : ' zero'}">${esc(label)}<b>${
      d.n} hit${d.n === 1 ? '' : 's'}${
      countOnly ? '' : ' · ' + d.dmg + ' dmg'}</b></span>`;

  // Every category is shown whether or not it happened -- a row that vanishes
  // reads as the tool having missed something rather than as a zero.
  // A parried swing always does nothing, so its damage is noise: count only.
  document.getElementById('parts').innerHTML =
    `<div class="prow">${chip('Counter reduced', duel.counter, 'counter')}${
      chip('Parry received', duel.parried, 'good', true)}${
      chip('Parry given', duel.gotparried, 'bad', true)}</div>` +
    `<div class="prow">${chip('Clean hits', clean, 'main')}${
      chip('Weapon ability hits', ability, 'ability')}${
      chip('Handle hits', handle, 'handle')}</div>` +
    `<div class="prow">${chip('Equipment hits received', armour, 'armor')}</div>`;

  const stopped = mine.length - clean.n;
  document.getElementById('defnote').textContent = stopped
    ? `${stopped} of ${mine.length} of your swings were stopped. Weapon ability `
      + `hits are the clean ones that carried a tag like Impale or Armor Pierced.`
    : '';
}
</script>
</body>
