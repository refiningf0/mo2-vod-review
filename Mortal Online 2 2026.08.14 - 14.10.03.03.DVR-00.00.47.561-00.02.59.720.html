<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MO2 Fight Log</title>
<style>
  /* Dark, gold-trimmed, numbers first -- a post-match screen rather than a
     spreadsheet. Everything is CSS: the report has to open with no network. */
  :root{
    --bg:#0b0d11; --panel:#14171d; --panel-2:#1a1e26;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
    --ink:#e9edf3; --mid:#98a2b0; --soft:#687382;
    --accent:#6d8cf5; --accent-dim:rgba(109,140,245,.45);
    --out:#3fbf78; --in:#ef5a52; --magic:#a78bfa; --heal:#43b8e0;
    --r:14px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;color:var(--ink);
    background:
      radial-gradient(1000px 480px at 50% -200px, rgba(109,140,245,.09), transparent 70%),
      var(--bg);
    background-attachment:fixed;
    font:15px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:44px 20px 120px;}
  .num{font-variant-numeric:tabular-nums;}

  /* ---- header ---- */
  .eyebrow{
    font-size:.64rem;letter-spacing:.28em;text-transform:uppercase;
    color:var(--soft);margin:0 0 10px;font-weight:600;
  }
  h1{
    font-size:clamp(1.5rem,3.4vw,2.15rem);margin:0 0 12px;line-height:1.15;
    letter-spacing:-.02em;font-weight:700;
    background:linear-gradient(180deg,#ffffff,#aab6c6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    overflow-wrap:anywhere;
  }
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 30px;padding:0;}
  .meta span{
    font-size:.72rem;color:var(--mid);border:1px solid var(--line);
    background:rgba(255,255,255,.02);border-radius:999px;padding:4px 11px;
    font-variant-numeric:tabular-nums;
  }

  /* ---- drop target ---- */
  .drop{
    display:block;border:1.5px dashed var(--line-2);border-radius:var(--r);
    padding:56px 20px;text-align:center;color:var(--mid);cursor:pointer;
    background:linear-gradient(180deg,var(--panel),rgba(17,22,32,.4));
    transition:border-color .15s,background .15s;
  }
  .drop:hover,.drop.over{border-color:var(--accent-dim);background:var(--panel-2);}
  .drop input{display:none;}
  .drop b{color:var(--ink);display:block;margin-bottom:5px;font-size:1.1rem;}

  /* ---- cards ---- */
  .card{
    position:relative;background:linear-gradient(180deg,var(--panel),rgba(15,20,29,.75));
    border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -30px #000;
  }
  h2{
    display:flex;align-items:center;gap:10px;
    font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;
    color:var(--mid);font-weight:600;margin:0 0 16px;
  }
  h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent);}

  /* ---- headline numbers ---- */
  /* The headline figures step back: they are the summary, not the story. */
  .strip{display:flex;flex-wrap:wrap;gap:26px;margin:0 0 22px;padding:0 2px;}
  .strip div{display:flex;align-items:baseline;gap:8px;}
  .strip .k{font-size:.63rem;text-transform:uppercase;letter-spacing:.15em;color:var(--soft);font-weight:600;}
  .strip b{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .strip .sub{font-size:.72rem;color:var(--soft);}
  .strip .dealt b{color:var(--out);} .strip .taken b{color:var(--in);}

  .lead-grid{display:grid;grid-template-columns:186px 1fr;gap:22px;align-items:start;}
  .picks h2{margin-bottom:12px;}
  .chart h2{margin-bottom:14px;}
  .focusnote{
    margin-left:auto;font-size:.7rem;letter-spacing:0;text-transform:none;
    color:var(--accent);font-weight:600;
  }
  .chart h2::after{display:none;}

  .pick{
    width:100%;display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:9px;
    background:none;border:1px solid transparent;color:inherit;font:inherit;
    padding:7px 8px;border-radius:9px;cursor:pointer;text-align:left;margin-bottom:2px;
    transition:background .12s,border-color .12s;
  }
  .pick:hover{background:rgba(255,255,255,.04);}
  .pick.on{background:rgba(109,140,245,.12);border-color:var(--accent-dim);}
  .pick .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;}
  .pick .av svg{width:15px;height:15px;}
  .pick .nm{font-size:.83rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pick.on .nm{color:var(--accent);}
  .pick .amt{font-size:.74rem;color:var(--soft);font-variant-numeric:tabular-nums;}
  .picks .clear{
    width:100%;margin-top:8px;background:none;border:1px solid var(--line);
    color:var(--soft);border-radius:8px;font:inherit;font-size:.72rem;padding:6px;cursor:pointer;
  }
  .picks .clear:hover{border-color:var(--accent-dim);color:var(--ink);}

  .totals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
  .stat{
    position:relative;overflow:hidden;padding:18px 20px 16px;
    background:linear-gradient(180deg,var(--panel),rgba(15,20,29,.7));
    border:1px solid var(--line);border-radius:var(--r);
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
  }
  .stat::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;opacity:.9;}
  .stat.dealt::before{background:linear-gradient(90deg,var(--out),transparent);}
  .stat.taken::before{background:linear-gradient(90deg,var(--in),transparent);}
  .stat.net::before{background:linear-gradient(90deg,var(--accent),transparent);}
  .stat .k{
    display:block;font-size:.63rem;text-transform:uppercase;letter-spacing:.16em;
    color:var(--soft);margin-bottom:10px;font-weight:600;
  }
  .stat b{
    display:block;font-size:clamp(1.9rem,4.6vw,2.6rem);font-weight:750;line-height:1;
    letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  }
  .stat.dealt b{color:var(--out);text-shadow:0 0 34px rgba(63,191,120,.28);}
  .stat.taken b{color:var(--in);text-shadow:0 0 34px rgba(239,90,82,.24);}
  .stat.net b{color:var(--ink);}
  .stat .sub{display:block;font-size:.74rem;color:var(--soft);margin-top:9px;}

  /* ---- timeline ---- */
  .tl{position:relative;}
  .tl svg{display:block;width:100%;height:210px;overflow:visible;}
  .tip{
    position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;
    background:rgba(11,13,17,.97);border:1px solid var(--line-2);border-radius:9px;
    padding:7px 10px;font-size:.78rem;white-space:nowrap;z-index:5;
    transform:translate(-50%,-100%);box-shadow:0 10px 30px -12px #000;
  }
  .rangewrap{position:relative;height:30px;margin-top:12px;}
  /* Without a visible rail the two handles float with nothing to hold, and it
     reads as decoration rather than a control. */
  .rail{
    position:absolute;left:0;right:0;top:12px;height:6px;border-radius:999px;
    background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line);
  }
  .sel{
    position:absolute;top:0;bottom:0;border-radius:999px;
    background:linear-gradient(90deg,rgba(109,140,245,.55),rgba(109,140,245,.75));
  }
  .rangewrap input{
    position:absolute;left:0;top:0;width:100%;height:30px;margin:0;padding:0;
    background:none;pointer-events:none;-webkit-appearance:none;appearance:none;
  }
  .rangewrap input:focus{outline:none;}
  .rangewrap input::-webkit-slider-runnable-track{height:30px;background:none;}
  .rangewrap input::-moz-range-track{height:30px;background:none;}
  .rangewrap input::-webkit-slider-thumb{
    -webkit-appearance:none;pointer-events:auto;cursor:ew-resize;
    width:15px;height:26px;border-radius:6px;margin-top:2px;
    background:
      linear-gradient(90deg,transparent 5px,rgba(0,0,0,.35) 5px 6px,transparent 6px,
                      transparent 9px,rgba(0,0,0,.35) 9px 10px,transparent 10px),
      linear-gradient(180deg,#9fb4fb,var(--accent));
    border:1.5px solid #0b0d11;box-shadow:0 2px 8px -2px rgba(0,0,0,.8);
  }
  .rangewrap input::-moz-range-thumb{
    pointer-events:auto;cursor:ew-resize;width:13px;height:24px;border-radius:6px;
    background:var(--accent);border:1.5px solid #0b0d11;
  }
  .rangewrap input::-webkit-slider-thumb:hover{filter:brightness(1.15);}
  .scrub{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    font-size:.74rem;margin-top:6px;font-variant-numeric:tabular-nums;
  }
  .scrub .edge{color:var(--soft);}
  .scrub .now{
    display:inline-flex;align-items:center;gap:8px;color:var(--soft);
  }
  .scrub .now.set{color:var(--ink);}
  .scrub .now b{color:var(--accent);font-weight:650;}
  .scrub button{
    background:none;border:1px solid var(--line-2);color:var(--mid);border-radius:7px;
    font:inherit;font-size:.71rem;padding:3px 9px;cursor:pointer;
  }
  .scrub button:hover{border-color:var(--accent-dim);color:var(--ink);}

  /* ---- scoreboard ---- */
  .filter{
    width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:10px 13px;font:inherit;font-size:.88rem;margin-bottom:8px;
  }
  .filter::placeholder{color:var(--soft);}
  .filter:focus{outline:none;border-color:var(--accent-dim);background:rgba(0,0,0,.4);}
  .hint{color:var(--soft);font-size:.72rem;margin:0 0 12px;}
  .exsum{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    color:var(--mid);font-size:.75rem;margin:0 0 10px;
  }
  .exsum button{
    background:none;border:none;color:var(--accent);font:inherit;font-size:.75rem;
    cursor:pointer;padding:0;text-decoration:underline;white-space:nowrap;
  }

  /* Fifteen names pushed the rest of the report off the screen. Five is
     enough to see the shape of the fight; the rest are a scroll away. */
  .opplist{
    max-height:296px;overflow-y:auto;overscroll-behavior:contain;
    -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 26px),transparent);
            mask-image:linear-gradient(180deg,#000 calc(100% - 26px),transparent);
    padding-right:4px;
  }
  .opplist.short{max-height:none;-webkit-mask-image:none;mask-image:none;}
  .opplist::-webkit-scrollbar{width:8px;}
  .opplist::-webkit-scrollbar-track{background:transparent;}
  .opplist::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.13);border-radius:99px;border:2px solid transparent;
    background-clip:content-box;
  }
  .opplist::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:content-box;}
  .opplist{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent;}
  .listnote{color:var(--soft);font-size:.72rem;margin:10px 0 0;}

  .opp{border-top:1px solid var(--line);}
  .opp:first-child{border-top:none;}
  .opprow{display:flex;align-items:center;gap:4px;}
  .opprow .oppbtn{flex:1;min-width:0;}
  .oppbtn{
    background:none;border:none;color:inherit;font:inherit;cursor:pointer;
    display:grid;grid-template-columns:26px 34px minmax(150px,1.2fr) 1.9fr 116px;
    align-items:center;gap:12px;padding:11px 8px;text-align:left;border-radius:10px;
    transition:background .12s;
  }
  .oppbtn:hover{background:rgba(255,255,255,.035);}
  .rank{font-size:.78rem;color:var(--soft);font-variant-numeric:tabular-nums;text-align:right;}
  .badge{
    width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    box-shadow:0 1px 3px -1px rgba(0,0,0,.5);
  }
  .badge svg{display:block;}
  .oppname{font-weight:650;font-size:.92rem;min-width:0;}
  .oppname .hits{display:block;font-weight:400;font-size:.69rem;color:var(--soft);letter-spacing:.02em;}
  /* Someone who took a real bite out of you should be findable at a glance in
     a fifteen-name list, without reading a single number. */
  .tag{
    display:inline-flex;align-items:center;vertical-align:-3px;margin-left:7px;
    border-radius:8px;padding:2px;
  }
  .tag svg{display:block;}
  .tag.danger{color:var(--in);background:rgba(239,90,82,.14);border:1px solid rgba(239,90,82,.4);}
  .tag.hard{color:var(--accent);background:rgba(109,140,245,.13);border:1px solid var(--accent-dim);}
  .opp.off .tag{opacity:.3;}
  .bars{display:flex;align-items:center;height:24px;}
  .half{flex:1;display:flex;height:9px;}
  .half.l{justify-content:flex-end;}
  .half .fill{border-radius:999px;min-width:0;transition:opacity .12s;}
  .half.l .fill{background:linear-gradient(270deg,var(--in),rgba(239,90,82,.45));}
  .half.r .fill{background:linear-gradient(90deg,var(--out),rgba(63,191,120,.45));}
  .spine{width:1px;height:24px;background:var(--line-2);flex:none;}
  .oppnums{display:flex;justify-content:space-between;font-size:.86rem;
           font-variant-numeric:tabular-nums;font-weight:650;}
  .oppnums .t{color:var(--in);} .oppnums .d{color:var(--out);} .oppnums .z{color:var(--soft);font-weight:400;}

  .ex{
    flex:none;background:none;border:1px solid transparent;color:var(--soft);
    font:inherit;font-size:1rem;line-height:1;width:30px;height:30px;
    border-radius:9px;cursor:pointer;opacity:0;transition:opacity .12s,color .12s;
  }
  .opprow:hover .ex,.opp.off .ex{opacity:1;}
  .ex:hover{border-color:var(--line-2);color:var(--ink);background:rgba(255,255,255,.05);}
  .ex:focus-visible{opacity:1;outline:2px solid var(--accent);outline-offset:1px;}
  .opp.off .oppname,.opp.off .oppnums,.opp.off .badge{opacity:.3;}
  .opp.off .half .fill{opacity:.2;}
  .opp.off .ex{color:var(--accent);}
  .opp.focus{background:linear-gradient(90deg,rgba(109,140,245,.09),transparent);border-radius:12px;}
  .opp.focus .oppname{color:var(--accent);}

  .detail{padding:0 8px 18px 74px;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th{font-size:.62rem;text-transform:uppercase;letter-spacing:.11em;color:var(--soft);
     font-weight:600;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);}
  td{padding:7px 9px;border-top:1px solid rgba(255,255,255,.045);color:var(--mid);}
  td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}
  td.n.out{color:var(--out);} td.n.in{color:var(--in);}
  td.who{color:var(--ink);}
  .chip{display:inline-block;font-size:.66rem;color:var(--mid);border:1px solid var(--line-2);
        border-radius:5px;padding:1px 6px;margin-right:4px;}

  /* ---- stat pills ---- */
  .parts{display:flex;flex-wrap:wrap;gap:9px;}
  .part{
    display:flex;align-items:baseline;gap:9px;
    background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:11px;
    padding:10px 14px;font-size:.79rem;color:var(--mid);
  }
  .part b{font-variant-numeric:tabular-nums;color:var(--ink);font-size:.92rem;font-weight:700;}
  .part.main{background:linear-gradient(180deg,rgba(63,191,120,.12),rgba(63,191,120,.04));
             border-color:rgba(63,191,120,.3);}
  .part.main b{color:var(--out);}
  .part.parry{background:linear-gradient(180deg,rgba(239,90,82,.13),rgba(239,90,82,.04));
              border-color:rgba(239,90,82,.34);}
  .part.parry b{color:var(--in);}
  .part.handle{background:linear-gradient(180deg,rgba(251,146,60,.13),rgba(251,146,60,.04));
               border-color:rgba(251,146,60,.34);}
  .part.handle b{color:#fb923c;}
  .prow{display:flex;flex-wrap:wrap;gap:9px;flex-basis:100%;}
  .prow + .prow{margin-top:9px;}

  /* Counter-reducing a hit is rare -- two of them across four fights -- so it
     gets the top row and is dressed to look like something you pulled off. */
  .part.trophy{
    align-items:center;gap:12px;
    padding:15px 20px;border-color:var(--accent);
    background:
      linear-gradient(135deg,rgba(109,140,245,.24),rgba(109,140,245,.07) 55%,transparent),
      var(--panel-2);
    box-shadow:0 0 46px -14px rgba(109,140,245,.55), inset 0 1px 0 rgba(255,255,255,.09);
  }
  .part.trophy .lbl{
    display:flex;align-items:center;gap:9px;
    font-size:.72rem;text-transform:none;letter-spacing:.01em;
    color:var(--accent);font-weight:700;
  }
  .part.trophy .lbl::before{content:"\25c6";font-size:.72rem;opacity:.9;}
  .part.trophy b{
    font-size:1.15rem;line-height:1;color:var(--accent);
    text-shadow:0 0 28px rgba(109,140,245,.65);
  }
  .part.magic b{color:var(--magic);}
  /* Present but not achieved: still readable, no longer shouting. */
  .part.zero{opacity:.45;}
  .part.zero b{color:var(--soft);}
  .part.trophy.zero{
    background:var(--panel-2);border-color:var(--line-2);box-shadow:none;opacity:1;
  }
  .part.trophy.zero .lbl{color:var(--soft);}
  .part.trophy.zero b{color:var(--soft);text-shadow:none;}
  .part.heal b{color:var(--heal);}
  .note,.who{color:var(--soft);font-size:.78rem;margin:14px 0 0;line-height:1.6;}
  .who b{color:var(--ink);font-weight:650;}

  .empty{color:var(--soft);text-align:center;padding:38px 0;font-size:.9rem;}

  @media(max-width:860px){
    .lead-grid{grid-template-columns:1fr;}
    .picks{order:2;}
  }
  @media(max-width:760px){
    .totals{grid-template-columns:1fr;}
    .strip{gap:16px;}
    .oppbtn{grid-template-columns:30px minmax(80px,1fr) 104px;gap:10px;}
    .rank,.bars{display:none;}
    .detail{padding-left:8px;}
  }

  /* Last, so it beats the display rule on whatever it is hiding. */
  .hide{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Mortal Online 2 &middot; Fight Report</p>
  <h1 id="title">MO2 Fight Log</h1>
  <div class="meta" id="meta"></div>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".json">
    <b>Drop a fight.json here</b>
    <span>or click to choose one</span>
  </label>

  <div id="app" class="hide">
    <div class="strip" id="totals"></div>

    <div class="card lead">
      <div class="lead-grid">
        <aside class="picks">
          <h2>Most involved</h2>
          <div id="picks"></div>
        </aside>
        <div class="chart">
          <h2>How the fight went <span class="focusnote" id="focusnote"></span></h2>
          <div class="tl" id="tl">
            <svg id="svg" preserveAspectRatio="none"></svg>
            <div class="tip" id="tip"></div>
          </div>
          <div class="rangewrap">
            <div class="rail"><div class="sel" id="sel"></div></div>
            <input type="range" id="r0" min="0" max="100" value="0"
                   aria-label="Start of the stretch to show">
            <input type="range" id="r1" min="0" max="100" value="100"
                   aria-label="End of the stretch to show">
          </div>
          <div class="scrub">
            <span class="edge">0:00</span>
            <span class="now" id="tnow"></span>
            <span class="edge" id="tend">0:00</span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Who you fought</h2>
      <p class="hint">Click a name to pick them out on the chart and open their hits. The &times; leaves someone out of the totals.</p>
      <div class="exsum" id="exsum"></div>
      <div class="opplist" id="opps"></div>
      <p class="listnote" id="listnote"></p>
    </div>

    <div class="card">
      <h2>How your hits landed</h2>
      <div class="parts" id="parts"></div>
      <p class="note" id="defnote"></p>
    </div>

    <div class="card" id="spellcard">
      <h2>Magic &amp; healing</h2>
      <div class="parts" id="spells"></div>
      <p class="who" id="healwho"></p>
    </div>
  </div>
</div>

<script>
let DATA = null;
let DUR = 1;
let T0 = 0, T1 = 0;

/* MO2 tags each line with where it landed, plus what happened to it. Only the
   first group is a location. Parry and Blocked are outcomes -- the swing
   connected with nothing. Sting is a weapon proc on an ordinary hit, so it is
   deliberately not called out as anything special. */
const BODY = ['Head','Torso','Right Limb','Left Limb','Lower Body'];
const NORMAL = ['Sting'];
// What actually happened to the swing. Where it landed matters far less than
// whether it landed at all, so these get counted on their own.
const OUTCOMES = ['Parry','Blocked','Equipment','Handle'];
const isBody = f => BODY.includes(f);
const isNoise = f => NORMAL.includes(f);
const isOutcome = f => OUTCOMES.includes(f);

/* ---------------- loading ---------------- */
window.addEventListener('DOMContentLoaded', () => {
  if (window.__BAKED__) { DATA = window.__BAKED__; start(); }
});
const drop = document.getElementById('drop');
document.getElementById('file').addEventListener('change',
  e => e.target.files[0] && read(e.target.files[0]));
['dragenter','dragover'].forEach(n => drop.addEventListener(n, e => {
  e.preventDefault(); drop.classList.add('over');
}));
['dragleave','drop'].forEach(n => drop.addEventListener(n, e => {
  e.preventDefault(); drop.classList.remove('over');
}));
drop.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) read(f); });

function read(f){
  const r = new FileReader();
  r.onload = () => {
    try { DATA = JSON.parse(r.result); } catch { alert('That is not valid JSON.'); return; }
    if (!DATA.events) { alert('No events in that file.'); return; }
    start();
  };
  r.readAsText(f);
}

/* ---------------- helpers ---------------- */
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const foe = e => e.dir === 'out' ? e.target : e.who;

/* Opponents taken out of the totals. Their row stays put, greyed, so you can
   see what you set aside and put it back. */
const EXCLUDED = new Set();
// One name at a time, to see just their exchange against the whole fight.
let FOCUS = null;
const inWindow = e => e.t >= T0 && e.t <= T1;
const isHit = e => (e.kind || 'hit') === 'hit';
const isHeal = e => e.kind === 'heal';
// An ability that is not a weapon is a spell: "arrow" is a bow, "Corrupt" is not.
const WEAPONS = ['arrow','arrows','bolt','bolts','dagger','sword','axe','mace',
                 'spear','javelin','hammer','bow','blade','lance','club','staff',
                 'knife','pike','halberd','shield','fist','fists'];
const isMagic = e => isHit(e) && e.ability && !WEAPONS.includes(e.ability.toLowerCase());
const counted = () => DATA.events.filter(e => inWindow(e) && !EXCLUDED.has(foe(e)));

function start(){
  drop.classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.getElementById('title').textContent =
    (DATA.source || 'Fight').replace(/\.[^.]+$/, '');
  DUR = Math.max(DATA.duration || 0, ...DATA.events.map(e => e.t), 1);
  document.getElementById('meta').innerHTML =
    [fmt(DUR), `${DATA.events.length} events`, `${(DATA.players||[]).length} players`]
      .map(t => `<span>${esc(t)}</span>`).join('');
  T0 = 0; T1 = DUR;
  document.getElementById('tend').textContent = fmt(DUR);

  const r0 = document.getElementById('r0'), r1 = document.getElementById('r1');
  // A step derived from the duration cannot land exactly on it, which leaves
  // the right handle short of the end so the fight never reads as whole.
  [r0, r1].forEach(r => { r.max = DUR; r.step = 'any'; });
  r0.value = 0; r1.value = DUR;
  const slide = () => {
    let a = +r0.value, b = +r1.value;
    if (a > b) { [a, b] = [b, a]; }   // handles may cross; treat it as a window
    T0 = a; T1 = b;
    render();
  };
  r0.addEventListener('input', slide);
  r1.addEventListener('input', slide);
  timeline(); render();
}

function render(){ totals(); picks(); opponents(); parts(); spells(); excluded(); dimTimeline(); }

function spells(){
  const ev = counted();
  const magic = ev.filter(isMagic);
  const heal = ev.filter(isHeal);
  document.getElementById('spellcard').classList.remove('hide');

  const sum = (a, d) => a.filter(e => e.dir === d).reduce((s, e) => s + e.amount, 0);
  const cnt = (a, d) => a.filter(e => e.dir === d).length;
  // How many casts it took does not matter; the total does.
  const box = (label, v, cls) =>
    `<span class="part ${cls}${v ? '' : ' zero'}">${label}<b>${v}</b></span>`;

  document.getElementById('spells').innerHTML =
    `<div class="prow">${box('Spell damage given',    sum(magic, 'out'), 'magic')}${
                        box('Spell damage received', sum(magic, 'in'),  'magic')}</div>` +
    `<div class="prow">${box('Healing given',         sum(heal,  'out'), 'heal')}${
                        box('Healing received',      sum(heal,  'in'),  'heal')}</div>`;

  // Who was on each end of it -- the point of tracking healing at all.
  const by = (a, k) => {
    const t = {};
    a.forEach(e => { const n = e[k]; if (n && n !== 'You') t[n] = (t[n] || 0) + e.amount; });
    return Object.entries(t).sort((x, y) => y[1] - x[1])
      .map(([n, v]) => `<b>${esc(n)}</b> ${v}`).join(', ');
  };
  const lines = [];
  const got = by(heal.filter(e => e.dir === 'in'), 'who');
  const gave = by(heal.filter(e => e.dir === 'out'), 'target');
  if (got)  lines.push('Healed by ' + got + '.');
  if (gave) lines.push('You healed ' + gave + '.');
  // "Spells seen: Corrupt" tells you nothing about who was casting it.
  const cast = by(magic.filter(e => e.dir === 'in'), 'who');
  const hitBy = by(magic.filter(e => e.dir === 'out'), 'target');
  if (cast)  lines.push('Spell damage from ' + cast + '.');
  if (hitBy) lines.push('Your spells hit ' + hitBy + '.');
  const spellNames = [...new Set(magic.map(e => e.ability))].filter(Boolean);
  if (spellNames.length) lines.push('Spells: ' + spellNames.map(esc).join(', ') + '.');
  document.getElementById('healwho').innerHTML = lines.join(' ');
}

function excluded(){
  const el = document.getElementById('exsum');
  if (!EXCLUDED.size){ el.innerHTML = ''; return; }
  const names = [...EXCLUDED];
  el.innerHTML = `<span>Not counted: ${names.map(esc).join(', ')}</span>
    <button id="clearex">count everyone</button>`;
  document.getElementById('clearex').addEventListener('click', () => {
    EXCLUDED.clear(); render();
  });
}

// Keep the chart honest about what the numbers above it are counting: grey
// out the time outside the window, and dim any hit either the window or an
// exclusion has taken out.
function dimTimeline(){
  const W = 1000, X = t => (t / DUR) * W;
  const l = document.getElementById('maskL'), r = document.getElementById('maskR');
  if (l) l.setAttribute('width', Math.max(0, X(T0)).toFixed(1));
  if (r) {
    r.setAttribute('x', X(T1).toFixed(1));
    r.setAttribute('width', Math.max(0, W - X(T1)).toFixed(1));
  }
  document.querySelectorAll('#hits rect').forEach(n => {
    const e = DATA.events[+n.dataset.i];
    const on = inWindow(e) && !EXCLUDED.has(foe(e)) &&
               (!FOCUS || foe(e) === FOCUS);
    n.setAttribute('opacity', on ? '.9' : (FOCUS ? '.08' : '.18'));
  });

  const whole = T0 <= 0.05 && T1 >= DUR - 0.05;
  const sel = document.getElementById('sel');
  if (sel){
    sel.style.left  = (T0 / DUR) * 100 + '%';
    sel.style.width = ((T1 - T0) / DUR) * 100 + '%';
  }
  // Say what the control does while it is untouched, and what it is doing
  // once it has been -- "whole fight" alone explained neither.
  const now = document.getElementById('tnow');
  now.classList.toggle('set', !whole);
  now.innerHTML = whole
    ? 'Drag either handle to zoom into part of the fight'
    : `Showing <b>${fmt(T0)} – ${fmt(T1)}</b><button id="reset">whole fight</button>`;
  const resetBtn = document.getElementById('reset');
  if (resetBtn) resetBtn.addEventListener('click', () => {
    const a = document.getElementById('r0'), b = document.getElementById('r1');
    a.value = 0; b.value = DUR; a.dispatchEvent(new Event('input'));
  });
}

/* ---------------- timeline ---------------- */
function timeline(){
  const ev = DATA.events, svg = document.getElementById('svg');
  const W = 1000, H = 200, mid = H/2, pad = 0;
  const peak = Math.max(...ev.map(e => e.amount), 1);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const X = t => (t/DUR)*(W-2*pad)+pad;
  // A parry does no damage but still happened, so give it a visible stub.
  const L = a => Math.max(3, (a/peak)*(mid-pad-16));

  // Running totals across the whole fight, drawn faintly behind the hits so
  // you can see momentum without losing the individual swings.
  const sorted = ev.slice().sort((a,b) => a.t - b.t);
  let co = 0, ci = 0;
  const cum = sorted.map(e => {
    if (e.dir === 'out') co += e.amount; else ci += e.amount;
    return {t:e.t, o:co, i:ci};
  });
  const cpeak = Math.max(co, ci, 1);
  const CY = (v, up) => up ? mid - (v/cpeak)*(mid-pad) : mid + (v/cpeak)*(mid-pad);
  const path = (sel, up) => {
    if (!cum.length) return '';
    let d = `M ${X(0)} ${mid}`;
    cum.forEach(p => { d += ` L ${X(p.t).toFixed(1)} ${CY(sel(p), up).toFixed(1)}`; });
    d += ` L ${X(DUR).toFixed(1)} ${CY(sel(cum[cum.length-1]), up).toFixed(1)}`;
    return d;
  };

  let bars = '';
  ev.forEach((e,i) => {
    const x = X(e.t), h = L(e.amount), up = e.dir === 'out';
    bars += `<rect x="${(x-2.5).toFixed(1)}" y="${(up ? mid-h : mid).toFixed(1)}"
      width="5" height="${h.toFixed(1)}" rx="1.5"
      fill="var(--${up?'out':'in'})" opacity=".9" data-i="${i}"></rect>`;
  });

  svg.innerHTML =
    `<rect id="maskL" x="0" y="0" width="0" height="${H}" fill="#0b0f16" opacity=".72"></rect>
     <rect id="maskR" x="0" y="0" width="0" height="${H}" fill="#0b0f16" opacity=".72"></rect>
     <path d="${path(p=>p.o,true)}"  fill="none" stroke="var(--out)" stroke-width="1.5" opacity=".33"></path>
     <path d="${path(p=>p.i,false)}" fill="none" stroke="var(--in)"  stroke-width="1.5" opacity=".33"></path>
     <line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="var(--line)" stroke-width="1"></line>
     <g id="hits">${bars}</g>`;

  const tip = document.getElementById('tip'), tl = document.getElementById('tl');
  svg.addEventListener('mousemove', ev2 => {
    const r = ev2.target;
    if (r.tagName !== 'rect' || !r.dataset.i) { tip.style.opacity = 0; return; }
    const e = DATA.events[+r.dataset.i];
    const where = (e.flags||[]).filter(f => !isNoise(f));
    tip.innerHTML = `${fmt(e.t)} &nbsp; ${e.dir==='out' ? 'you hit' : 'hit by'}
      <b>${esc(foe(e))}</b> for <b>${e.amount}</b>` +
      (where.length ? ` · ${esc(where.join(', '))}` : '');
    const box = tl.getBoundingClientRect();
    tip.style.left = (ev2.clientX - box.left) + 'px';
    tip.style.top  = (ev2.clientY - box.top - 10) + 'px';
    tip.style.opacity = 1;
  });
  svg.addEventListener('mouseleave', () => tip.style.opacity = 0);
}


/* ---------------- headline ---------------- */
function totals(){
  const ev = counted().filter(isHit);
  const out = ev.filter(e => e.dir==='out'), inc = ev.filter(e => e.dir==='in');
  const o = out.reduce((s,e)=>s+e.amount,0), i = inc.reduce((s,e)=>s+e.amount,0);
  const avg = a => a.length ? Math.round(a.reduce((s,e)=>s+e.amount,0)/a.length) : 0;
  document.getElementById('totals').innerHTML = `
    <div class="dealt"><span class="k">Dealt</span><b>${o.toLocaleString()}</b>
      <span class="sub">${out.length} hits, ${avg(out)} avg</span></div>
    <div class="taken"><span class="k">Taken</span><b>${i.toLocaleString()}</b>
      <span class="sub">${inc.length} hits, ${avg(inc)} avg</span></div>
    <div class="net"><span class="k">Net</span><b>${o-i>=0?'+':''}${(o-i).toLocaleString()}</b>
      <span class="sub">${i ? (o/i).toFixed(1)+'\u00d7 traded' : 'took nothing'}</span></div>`;
}

/* ---------------- the fight's headline players ---------------- */
// Ranked the same way the scoreboard is, so the shortlist and the full list
// never disagree about who mattered.
function involvement(){
  const by = {};
  DATA.events.filter(e => inWindow(e) && isHit(e)).forEach(e => {
    const n = foe(e);
    if (!n) return;
    const d = (by[n] = by[n] || {dealt: 0, taken: 0, rows: []});
    d[e.dir === 'out' ? 'dealt' : 'taken'] += e.amount;
    d.rows.push(e);
  });
  return by;
}

function picks(){
  const by = involvement();
  const top = Object.keys(by)
    .sort((a, b) => (by[b].dealt + by[b].taken) - (by[a].dealt + by[a].taken))
    .slice(0, 5);
  const el = document.getElementById('picks');
  if (!top.length){ el.innerHTML = '<div class="empty">Nobody yet.</div>'; return; }

  el.innerHTML = top.map(n => {
    const d = by[n];
    return `<button class="pick${FOCUS === n ? ' on' : ''}" data-p="${esc(n)}">
      <span class="av" style="background:${tint(n)}">${mark()}</span>
      <span class="nm">${esc(n)}</span>
      <span class="amt">${d.dealt + d.taken}</span>
    </button>`;
  }).join('') + (FOCUS ? '<button class="clear" id="clearfocus">show everyone</button>' : '');

  el.querySelectorAll('.pick').forEach(b =>
    b.addEventListener('click', () => setFocus(b.dataset.p)));
  const c = document.getElementById('clearfocus');
  if (c) c.addEventListener('click', () => setFocus(FOCUS));
}

// One place decides who is highlighted, so the shortlist, the scoreboard and
// the chart cannot drift out of step.
function setFocus(n){
  FOCUS = (FOCUS === n) ? null : n;
  document.querySelectorAll('.opp').forEach(o => o.classList.remove('focus'));
  if (FOCUS){
    const b = document.querySelector(`.oppbtn[data-n="${CSS.escape(FOCUS)}"]`);
    if (b) b.closest('.opp').classList.add('focus');
  }
  document.getElementById('focusnote').textContent = FOCUS ? `showing ${FOCUS}` : '';
  picks();
  dimTimeline();
}

/* ---------------- opponents ---------------- */
function opponents(){
  const by = involvement();
  let names = Object.keys(by);
  names.sort((a,b) => (by[b].dealt+by[b].taken) - (by[a].dealt+by[a].taken));

  const el = document.getElementById('opps');
  if (!names.length){
    el.innerHTML = '<div class="empty">No hits in this stretch.</div>';
    return;
  }
  // One scale across everyone, so bar lengths compare between rows.
  const peak = Math.max(1, ...names.map(n => Math.max(by[n].dealt, by[n].taken)));

  el.innerHTML = names.map((n, i) => {
    const d = by[n], hits = d.rows.length;
    const off = EXCLUDED.has(n);
    return `<div class="opp${off ? ' off' : ''}">
      <div class="opprow">
      <button class="oppbtn" data-n="${esc(n)}" aria-expanded="false">
        <span class="rank num">${i + 1}</span>
        <span class="badge" style="background:${tint(n)}">${mark()}</span>
        <span class="oppname">${esc(n)}${threat(d.taken, d.dealt)}<span class="hits">${hits} hit${hits===1?'':'s'}</span></span>
        <span class="bars">
          <span class="half l"><span class="fill" style="width:${(d.taken/peak)*100}%"></span></span>
          <span class="spine"></span>
          <span class="half r"><span class="fill" style="width:${(d.dealt/peak)*100}%"></span></span>
        </span>
        <span class="oppnums">
          <span class="${d.taken?'t':'z'}">${d.taken || '—'}</span>
          <span class="${d.dealt?'d':'z'}">${d.dealt || '—'}</span>
        </span>
      </button>
      <button class="ex" data-x="${esc(n)}" aria-pressed="${off}"
              title="${off ? 'Count ' + esc(n) + ' again' : 'Leave ' + esc(n) + ' out of the totals'}"
        >${off ? '+' : '\u00d7'}</button>
      </div>
      <div class="detail hide" data-d="${esc(n)}">${table(d.rows)}</div>
    </div>`;
  }).join('');

  el.classList.toggle('short', names.length <= 5);
  const note = document.getElementById('listnote');
  if (note) note.textContent = names.length > 5
    ? `Showing 5 of ${names.length} \u2014 scroll the list for the rest.` : '';

  el.querySelectorAll('.ex').forEach(b => b.addEventListener('click', () => {
    const n = b.dataset.x;
    EXCLUDED.has(n) ? EXCLUDED.delete(n) : EXCLUDED.add(n);
    render();
  }));

  el.querySelectorAll('.oppbtn').forEach(b => b.addEventListener('click', () => {
    const n = b.dataset.n;
    const d = el.querySelector(`.detail[data-d="${CSS.escape(n)}"]`);
    const open = !d.classList.contains('hide');
    d.classList.toggle('hide', open);
    b.setAttribute('aria-expanded', String(!open));

    // Opening a name focuses it; closing it again gives the whole fight back.
    setFocus(open ? FOCUS : n);
    if (!open) d.scrollIntoView({block: 'nearest'});
  }));

  // A rebuild throws the rows away, so put the marker back on the focused one.
  if (FOCUS) {
    const b = el.querySelector(`.oppbtn[data-n="${CSS.escape(FOCUS)}"]`);
    if (b) b.closest('.opp').classList.add('focus');
    else FOCUS = null;
  }
}

// Placeholder avatars, in the spirit of a chat app's default: a flat colour
// and a plain bust. Fixed by the name so a player looks the same every report.
const AVATAR_BG = ['#5865f2', '#747f8d', '#3ba55c', '#faa81a', '#ed4245', '#eb459e'];

function nameHash(name){
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return h;
}
function tint(name){
  return AVATAR_BG[nameHash(name) % AVATAR_BG.length];
}
const SKULL = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" ' +
  'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M12 2.4c4.5 0 7.8 3.1 7.8 7.3 0 2.7-1.3 4.2-2.5 5.2v3.4c0 1-.9 1.9-1.9 1.9H8.6' +
  'c-1 0-1.9-.9-1.9-1.9v-3.4c-1.2-1-2.5-2.5-2.5-5.2 0-4.2 3.3-7.3 7.8-7.3z"/>' +
  '<circle cx="9.1" cy="10.4" r="1.6"/><circle cx="14.9" cy="10.4" r="1.6"/>' +
  '<path d="M10.6 15.4v2.6M13.4 15.4v2.6"/></svg>';

const BLADE = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" ' +
  'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M12 2.2 12 15M8.6 14.6h6.8M12 15.4v3.2"/>' +
  '<circle cx="12" cy="20.4" r="1.6"/></svg>';

// One line, both ways: 150 is where someone stopped being incidental to the
// fight. The glyph says which side of it they were on; the number is a
// tooltip, because the row already carries it.
const HURT = 150;

function threat(dealtToYou, youDealt){
  if (dealtToYou >= HURT)
    return `<span class="tag danger" title="They put ${dealtToYou} through you">${SKULL}</span>`;
  if (youDealt >= HURT)
    return `<span class="tag hard" title="You put ${youDealt} through them">${BLADE}</span>`;
  return '';
}

function mark(){
  return '<svg viewBox="0 0 24 24" width="21" height="21" fill="#fff" aria-hidden="true">' +
    '<circle cx="12" cy="8.6" r="4.1"/>' +
    '<path d="M12 14.1c-3.9 0-7 2.4-7 5.4v1.2h14v-1.2c0-3-3.1-5.4-7-5.4z"/></svg>';
}

function table(rows){
  const body = rows.slice().sort((a,b)=>a.t-b.t).map(r => {
    const flags = (r.flags||[]).filter(f => !isNoise(f));
    const where = flags.filter(isBody);
    const how   = flags.filter(f => !isBody(f));
    return `<tr>
      <td class="num">${fmt(r.t)}</td>
      <td class="who">${r.dir==='out' ? 'you hit' : 'hit you'}</td>
      <td class="n ${r.dir}">${r.amount}</td>
      <td>${esc(where.join(', ')) || '—'}</td>
      <td>${how.map(m => `<span class="chip">${esc(m)}</span>`).join('')}</td>
    </tr>`;
  }).join('');
  return `<table><thead><tr>
    <th>time</th><th></th><th style="text-align:right">dmg</th><th>where</th><th></th>
  </tr></thead><tbody>${body}</tbody></table>`;
}

/* ---------------- how hits landed ---------------- */
function parts(){
  const hits = counted().filter(e => e.dir === 'out' && isHit(e));
  const tally = {};
  let clean = {n: 0, dmg: 0};

  hits.forEach(e => {
    const flags = (e.flags || []).filter(f => !isNoise(f));
    const how = flags.filter(isOutcome);
    if (!how.length) {
      // Landed on a body part and nothing got in the way.
      clean.n++; clean.dmg += e.amount;
      return;
    }
    // A swing can be stopped two ways at once ("0[Parry][Handle]"), so it is
    // counted under each rather than forced into one.
    how.forEach(f => {
      tally[f] = tally[f] || {n: 0, dmg: 0};
      tally[f].n++; tally[f].dmg += e.amount;
    });
  });

  const TONE = {Parry: 'parry', Handle: 'handle'};
  const LABEL = {Parry: 'Parried hits', Handle: 'Handle hits',
                 Blocked: 'Blocked', Equipment: 'Equipment hits'};
  // A parried swing always does nothing, so its damage is noise -- count only.
  const COUNT_ONLY = ['Parry'];
  // "1 hit \u00b7 12" leaves you guessing what 12 is. Say it.
  const chip = (label, d, cls, countOnly) =>
    `<span class="part${cls ? ' ' + cls : ''}${d.n ? '' : ' zero'}">${esc(label)}<b>${
      d.n} hit${d.n === 1 ? '' : 's'}${
      countOnly ? '' : ' \u00b7 ' + d.dmg + ' dmg'}</b></span>`;

  const el = document.getElementById('parts');

  // Every chip above is a swing of yours. This one is the other way round:
  // a hit you took whose damage your own counter cut down.
  const countered = counted().filter(e =>
    isHit(e) && e.dir === 'in' && (e.flags || []).includes('Counter Reduced'));
  const trophy =
    `<span class="part trophy${countered.length ? '' : ' zero'}">` +
    `<span class="lbl">Counter reduced</span>` +
    `<b>${countered.length}</b></span>`;

  // Every category is shown whether or not it happened -- a row that vanishes
  // reads as the tool having missed something rather than as a zero.
  const pick = f => chip(LABEL[f], tally[f] || {n: 0, dmg: 0},
                         TONE[f] || '', COUNT_ONLY.includes(f));

  // Landed, stopped by them, stopped by your own grip -- then the odds and ends.
  el.innerHTML =
    `<div class="prow">${trophy}</div>` +
    `<div class="prow">${chip('Clean hits', clean, 'main')}${pick('Parry')}${pick('Handle')}</div>` +
    `<div class="prow">${pick('Equipment')}${pick('Blocked')}</div>`;

  const stopped = hits.length - clean.n;
  document.getElementById('defnote').textContent = stopped
    ? `${stopped} of ${hits.length} swings were parried, blocked, or caught armour or the handle.`
    : '';
}
</script>
