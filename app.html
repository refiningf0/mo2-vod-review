<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MO2 VOD Review</title>
<style>
  /* Same dark, gold-trimmed world as the report it opens into, so the app and
     its output do not look like two different programs. */
  :root{
    --bg:#0b0d11; --panel:#14171d; --panel-2:#1a1e26;
    --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.14);
    --ink:#e9edf3; --mid:#98a2b0; --soft:#687382;
    --accent:#6d8cf5; --gold:#ffc74a; --out:#3fbf78; --in:#ef5a52;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:
      radial-gradient(900px 420px at 50% -180px, rgba(109,140,245,.08), transparent 70%),
      var(--bg);
    color:var(--ink);
    font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .hide{display:none !important;}

  /* ---- title bar ---- */
  header{
    flex:none;display:flex;align-items:center;gap:12px;
    padding:14px 20px;border-bottom:1px solid var(--line);
    transition:padding .12s;
  }
  /* Watching a clip, the name of the app is the least interesting thing on
     screen. It stands down to a thin strip that is mostly somewhere to drop
     the next clip, and gives the height back to the video. */
  header.lean{padding:5px 12px;}
  header.lean .mark,header.lean .sub{display:none;}
  header.lean h1{font-size:.76rem;font-weight:600;color:var(--soft);}
  header .mark{
    width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
    background:linear-gradient(160deg,rgba(255,199,74,.9),rgba(255,199,74,.35));
    color:#0b0d11;font-weight:800;font-size:.72rem;
  }
  header h1{font-size:.9rem;font-weight:700;margin:0;letter-spacing:.01em;}
  header .sub{font-size:.72rem;color:var(--soft);}
  header .right{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .btn{
    background:rgba(255,255,255,.05);border:1px solid var(--line-2);color:var(--ink);
    font:inherit;font-size:.78rem;padding:6px 13px;border-radius:8px;cursor:pointer;
    transition:background .12s,border-color .12s;
  }
  .btn:hover{background:rgba(255,255,255,.09);}
  .btn.primary{
    background:linear-gradient(180deg,#7e99f7,var(--accent));border-color:transparent;
    color:#0b0d11;font-weight:650;
  }
  .btn:disabled{opacity:.45;cursor:default;}

  main{flex:1;min-height:0;display:flex;flex-direction:column;}

  /* ---- the landing view ---- */
  #home{flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;padding:22px;overflow:auto;}

  h2{
    font-size:.66rem;letter-spacing:.17em;text-transform:uppercase;color:var(--mid);
    font-weight:600;margin:0 0 11px;display:flex;align-items:center;gap:10px;
  }
  h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-2),transparent);}

  .fights{display:flex;flex-direction:column;gap:6px;}
  .row{
    display:flex;align-items:stretch;gap:6px;
    border-radius:9px;background:rgba(255,255,255,.026);
    border:1px solid var(--line);transition:background .12s,border-color .12s;
  }
  .row:hover{background:rgba(255,255,255,.06);border-color:var(--line-2);}
  .fight{
    flex:1;min-width:0;
    display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;
    padding:10px 13px;cursor:pointer;text-align:left;
    background:none;border:0;color:var(--ink);font:inherit;
  }
  /* Kept quiet until the row is under the cursor: throwing a report away is
     not what anyone came to this list to do. */
  .del{
    flex:none;width:38px;border:0;background:none;cursor:pointer;
    color:var(--soft);font:inherit;font-size:1rem;line-height:1;
    border-radius:0 8px 8px 0;opacity:0;transition:opacity .12s,color .12s,background .12s;
  }
  .row:hover .del{opacity:1;}
  .del:hover{color:var(--in);background:rgba(239,90,82,.12);}
  .del:focus-visible{opacity:1;outline:2px solid var(--in);outline-offset:-2px;}
  .del.armed{opacity:1;color:var(--in);background:rgba(239,90,82,.18);width:auto;padding:0 11px;font-size:.74rem;}
  .fight .nm{font-weight:600;font-size:.87rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fight .meta{font-size:.72rem;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .fight .net{font-size:.84rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .fight .net.up{color:var(--out);} .fight .net.down{color:var(--in);}
  .empty{color:var(--soft);font-size:.85rem;padding:14px 2px;}

  /* ---- working ---- */
  #working{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:40px 60px;}
  #working .clip{font-size:1.02rem;font-weight:650;text-align:center;}
  #working .stage{font-size:.82rem;color:var(--mid);text-align:center;min-height:1.4em;}
  .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;}
  .bar span{
    display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#7e99f7,var(--accent));transition:width .2s;
  }
  .bar.idle span{
    width:32% !important;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation:sweep 1.25s ease-in-out infinite;
  }
  @keyframes sweep{0%{transform:translateX(-110%);}100%{transform:translateX(420%);}}
  @media (prefers-reduced-motion:reduce){.bar.idle span{animation:none;width:100% !important;opacity:.5;}}
  #working .note{font-size:.76rem;color:var(--soft);text-align:center;}

  /* ---- the report, shown in place ----
     One scroller, not two: the clip and its marks take the window, and the
     report is underneath, reached by scrolling past them. The frame is given
     the report's own height so it never scrolls inside its own box. */
  #view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;}
  #view iframe{display:block;width:100%;border:0;background:var(--bg);}

  /* ---- the clip ---- */
  #player{
    flex:none;display:none;background:#000;position:relative;
  }
  #player.on{display:block;}
  /* Height is set from what is actually on screen -- see fitPlayer(). Guessing
     it left the bottom bar sliced in half. */
  #player video{display:block;width:100%;background:#000;object-fit:contain;
                height:60vh;min-height:240px;}
  #player .bar{
    position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;
    gap:10px;padding:7px 12px;font-size:.74rem;color:var(--mid);
    background:linear-gradient(0deg,rgba(0,0,0,.82),rgba(0,0,0,0));
    opacity:0;transition:opacity .15s;pointer-events:none;
  }
  #player:hover .bar{opacity:1;}
  #player .bar b{color:var(--ink);font-variant-numeric:tabular-nums;}
  /* In the header, not over the video: a control that only appears when the
     mouse is already on the thing it hides is a control you cannot find. */

  /* ---- the three bars, under the clip and driving it ---- */
  #deck{display:none;padding:7px 14px 12px;background:var(--bg);
        border-bottom:1px solid var(--line);}
  #deck.on{display:block;}
  #deck .lane{
    position:relative;display:block;width:100%;height:32px;margin-bottom:5px;
    border-radius:7px;border:1px solid var(--line);cursor:default;
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));
  }
  #deck .lane:last-child{margin-bottom:0;}
  #deck .lab{
    position:absolute;left:9px;top:0;height:14px;display:flex;align-items:center;
    font-size:.55rem;letter-spacing:.09em;text-transform:uppercase;font-weight:600;
    color:var(--mid);pointer-events:none;
  }
  #deck .n{
    position:absolute;right:9px;top:0;height:14px;display:flex;align-items:center;
    font-size:.68rem;font-weight:700;color:var(--tone);pointer-events:none;
    font-variant-numeric:tabular-nums;
  }
  /* The line the marks sit on. It is drawn after them, so without this it
     takes the click for the two pixels straight through the middle of every
     dot -- exactly where anyone aims. */
  #deck .lane::after{content:"";position:absolute;left:9px;right:9px;top:22px;
                     height:1px;background:rgba(255,255,255,.07);
                     pointer-events:none;}
  /* The mark you see stays small; the mark you click does not have to. A 20px
     target around a 10px dot, so the bar can be a third shorter without the
     marks getting fiddly again. */
  #deck i{
    position:absolute;top:22px;width:20px;height:20px;z-index:2;
    transform:translate(-50%,-50%);cursor:pointer;
  }
  #deck i::after{
    content:"";position:absolute;inset:5px;border-radius:50%;
    background:var(--tone);transition:inset .1s;
    box-shadow:0 0 0 2px rgba(12,15,20,.92),0 0 7px -1px var(--tone);
  }
  #deck i:hover::after{inset:1.5px;}
  #deck i:active::after{inset:3px;}
  #deck .counter{--tone:var(--gold);}
  #deck .good{--tone:var(--out);}
  #deck .bad{--tone:var(--in);}
  #deck .none{color:var(--soft);}

  /* ---- something went wrong ---- */
  #oops{padding:26px;display:flex;flex-direction:column;gap:12px;}
  #oops .what{
    background:rgba(239,90,82,.08);border:1px solid rgba(239,90,82,.35);
    border-radius:11px;padding:15px 17px;font-size:.86rem;color:var(--ink);
  }
  #oops pre{
    margin:0;max-height:230px;overflow:auto;white-space:pre-wrap;word-break:break-word;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:13px;font:11.5px/1.5 "Cascadia Mono",Consolas,monospace;color:var(--mid);
  }
</style>
</head>
<body>

<header>
  <span class="mark">M2</span>
  <span>
    <h1>MO2 VOD Review</h1>
    <span class="sub" id="sub">drop a clip to read it</span>
  </span>
  <span class="right">
    <button class="btn hide" id="vclip">Hide clip</button>
    <button class="btn hide" id="back">&larr; All fights</button>
  </span>
</header>

<main>
  <!-- landing -->
  <section id="home">
    <div>
      <h2>Fights you have read</h2>
      <div class="fights" id="fights"><div class="empty">Loading&hellip;</div></div>
    </div>
  </section>

  <!-- working -->
  <section id="working" class="hide">
    <div class="clip" id="wclip"></div>
    <div class="bar" id="wbar"><span></span></div>
    <div class="stage" id="wstage"></div>
    <div class="note">About half a minute per minute of footage.</div>
  </section>

  <!-- the report -->
  <section id="view" class="hide">
    <div id="player">
      <video id="vid" preload="metadata" controls playsinline></video>
      <div class="bar"><span>Click a mark below, or anything in the report, to jump there</span></div>
    </div>
    <div id="deck"></div>
    <iframe id="frame" title="Fight report"></iframe>
    <div class="empty hide" id="frameoops">That report would not open.</div>
  </section>

  <!-- failure -->
  <section id="oops" class="hide">
    <div class="what" id="oopswhat"></div>
    <pre id="oopsdetail"></pre>
    <div><button class="btn" id="oopsback">&larr; Back</button></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const show = which => {
  ['home','working','view','oops'].forEach(s => $(s).classList.toggle('hide', s !== which));
  $('back').classList.toggle('hide', which !== 'view');
  document.querySelector('header').classList.toggle('lean', which === 'view');
  if (which !== 'view') {
    $('vid').pause();
    $('player').classList.remove('on');
    $('deck').classList.remove('on');
    $('vclip').classList.add('hide');
    haveClip = false; hasMarks = false; clipShown = true;
  }
  // The drop area is drawn by Windows above this page, so it cannot know what
  // the page is showing unless it is told.
  // The drop area belongs to the fights list. Over a report it was taking
  // height the clip wanted, so it stands aside entirely.
  if (window.pywebview) window.pywebview.api.show_strip(
    which === 'home' ? 'full' : 'hidden');
};

// Python calls this as the run moves along.
window.onProgress = (stage, done, total) => {
  const words = {
    probe:'Looking at the video', crop:'Finding the combat log',
    extract:'Pulling out frames', preprocess:'Sharpening the text',
    ocr:'Reading the text', parse:'Working out what happened', done:'Done',
  };
  $('wstage').textContent = words[stage] || stage;
  const bar = $('wbar');
  if (done && total) {
    bar.classList.remove('idle');
    bar.firstElementChild.style.width = (done / total * 100).toFixed(1) + '%';
  } else {
    // A stage that cannot count itself sweeps instead of pretending to know.
    bar.classList.add('idle');
  }
};

async function openReport(path){
  // The bars under the clip come from the data, not the page.
  window.pywebview.api.report_data(path).then(deck).catch(() => deck(null));
  // The report's HTML is fetched and written straight into the frame. Pointing
  // it at a file:// address left the view blank with nothing to explain it.
  const f = $('frame'), oops = $('frameoops');
  oops.classList.add('hide');
  f.classList.remove('hide');
  show('view');
  const html = await window.pywebview.api.read_report(path);
  if (html) { f.srcdoc = html; }
  else { f.classList.add('hide'); oops.classList.remove('hide'); }
}

window.onDone = report => { openReport(report); refresh(); };

window.onFailed = (msg, detail) => {
  $('oopswhat').textContent = msg;
  $('oopsdetail').textContent = detail || '';
  show('oops');
};

function disarm(){
  document.querySelectorAll('.del.armed').forEach(x => {
    x.classList.remove('armed');
    x.innerHTML = '&times;';
  });
}
document.addEventListener('click', e => {
  if (!e.target.closest('.del')) disarm();
});

async function refresh(){
  const rows = await window.pywebview.api.history();
  const el = $('fights');
  if (!rows.length){ el.innerHTML = '<div class="empty">Nothing read yet.</div>'; return; }
  el.innerHTML = rows.map(r => {
    const p = r.html.replace(/"/g, '&quot;');
    return `<div class="row">
      <button class="fight" data-html="${p}">
        <span class="nm">${r.name}</span>
        <span class="meta">${r.when} &middot; ${r.length} &middot; ${r.events} events</span>
        <span class="net ${r.net >= 0 ? 'up' : 'down'}">${r.net >= 0 ? '+' : ''}${r.net}</span>
      </button>
      <button class="del" data-html="${p}" title="Delete this report"
              aria-label="Delete ${r.name}">&times;</button>
    </div>`;
  }).join('');
  el.querySelectorAll('.fight').forEach(b => b.addEventListener('click', () => {
    openReport(b.dataset.html);
  }));
  // Two clicks, because there is no undo: the first says what is about to
  // happen, and clicking anywhere else takes it back.
  el.querySelectorAll('.del').forEach(b => b.addEventListener('click', async e => {
    e.stopPropagation();
    if (!b.classList.contains('armed')) {
      disarm();
      b.classList.add('armed');
      b.textContent = 'Delete?';
      return;
    }
    b.textContent = '…';
    await window.pywebview.api.delete_report(b.dataset.html);
    refresh();
  }));
}

async function pick(){
  const path = await window.pywebview.api.choose();
  if (path) begin(path);
}

// Called by Python whenever a run begins, however it began -- a click here or
// a clip dropped on the window. One place switches the view, so a drop cannot
// quietly start work while the page carries on showing the drop zone.
window.onStarted = name => {
  $('wclip').textContent = name;
  $('wstage').textContent = 'Starting…';
  $('wbar').classList.add('idle');
  show('working');
};

function begin(path){ window.pywebview.api.start(path); }

$('back').addEventListener('click', () => { show('home'); refresh(); });
$('oopsback').addEventListener('click', () => { show('home'); refresh(); });

// The drop is handled below the page, by the window itself -- a page is never
// told where a dropped file lives, and the clip has to be opened by path. So
// the native side calls these: one to light the zone while a file is over the
// window, one to say whether dropping is available at all.

window.onDropReady = ok => {
  $('sub').textContent = ok ? 'drop a clip above to read it'
                            : 'click above to choose a clip';
};

// The page never sees the drop while that is working. This is for when it is
// not: swallow it rather than letting the webview navigate to the file, and
// ask for it instead.
['dragenter','dragover','dragleave','drop'].forEach(n =>
  document.addEventListener(n, e => e.preventDefault()));
document.addEventListener('drop', e => {
  if (e.dataTransfer.files && e.dataTransfer.files.length) {
    $('sub').textContent = 'that drop did not carry a location — choose the file instead';
    pick();
  }
});

// The report sits in a frame and cannot reach Python itself, so it asks
// through here when someone clicks its title to play the clip.
// How far before the moment to start, so there is a run-up to watch rather
// than the hit already having landed. A parry is decided well before the log
// records it, so the seconds in front of it are the ones worth seeing.
const LEADIN = 4;
let haveClip = false;

window.addEventListener('message', async e => {
  const m = e.data;
  if (!m || !m.mo2 || !window.pywebview) return;

  // The report says which clip it came from as soon as it opens.
  if (m.mo2 === 'clip-path') {
    haveClip = false;
    $('player').classList.remove('on');
    $('vclip').classList.add('hide');
    if (!m.path) return;
    const url = await window.pywebview.api.clip_url(m.path);
    if (!url) return;                 // not on this machine; go without
    $('vid').src = url;
    haveClip = true;
    $('vclip').classList.remove('hide');
    showClip(true);
    return;
  }

  // The report is as tall as it is; the frame is told to match so there is one
  // scrollbar for the whole view rather than one inside another.
  if (m.mo2 === 'height' && m.h > 0) {
    $('frame').style.height = Math.ceil(m.h) + 'px';
    return;
  }

  // A moment in the report was clicked.
  if (m.mo2 === 'seek' && typeof m.t === 'number') { seekTo(m.t); return; }

  // The title, which means the whole clip rather than a moment in it.
  if (m.mo2 === 'play-clip') {
    if (haveClip) {
      if (!clipShown) showClip(true);
      $('vid').play().catch(() => {});
    } else {
      window.pywebview.api.open_clip(m.path).then(ok => {
        if (!ok) $('sub').textContent = 'that clip is not where the report says it is';
      });
    }
  }
});

// The three bars under the clip: every mark is a moment, and clicking one
// takes the clip there. Drawn here rather than in the report, because the
// report lives in a frame below and these belong with the video.
const DECK = [
  {k: 'counter', label: 'Counter reduced', tone: 'counter',
   test: e => e.dir === 'in'  && (e.flags || []).includes('Counter Reduced')},
  {k: 'parried', label: 'Parry received', tone: 'good',
   test: e => e.dir === 'in'  && (e.flags || []).includes('Parry')},
  {k: 'gotparried', label: 'Parry given', tone: 'bad',
   test: e => e.dir === 'out' && (e.flags || []).includes('Parry')},
];

let hasMarks = false;

function deck(data){
  const el = $('deck');
  hasMarks = false;
  if (!data || !data.events || !data.events.length) {
    el.classList.remove('on');
    el.innerHTML = '';
    return;
  }
  const span = Math.max(data.duration || 0,
                        ...data.events.map(e => e.t), 1);
  el.innerHTML = DECK.map(d => {
    const rows = data.events.filter(d.test);
    const marks = rows.map(e => {
      const who = e.dir === 'in' ? e.who : e.target;
      return `<i style="left:${((e.t / span) * 100).toFixed(2)}%" data-t="${e.t}"
                 title="${fmt(e.t)} · ${d.label} · ${esc(who || '')}"></i>`;
    }).join('');
    return `<div class="lane ${d.tone}">
      <span class="lab">${d.label}</span>${marks}
      <span class="n${rows.length ? '' : ' none'}">${rows.length}</span></div>`;
  }).join('');
  hasMarks = true;
  el.classList.toggle('on', clipShown);
  el.querySelectorAll('i').forEach(m => m.addEventListener('click',
    () => seekTo(parseFloat(m.dataset.t))));
  fitPlayer();
}

const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
const esc = t => String(t).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// The clip takes everything the window has left once the header and the bars
// have had theirs, and a little more so the marks are not sitting on the edge.
function fitPlayer(){
  const v = $('vid'), d = $('deck'), h = document.querySelector('header');
  if (!v) return;
  const room = window.innerHeight - (h ? h.offsetHeight : 0)
                                  - (d.classList.contains('on') ? d.offsetHeight : 0) - 6;
  v.style.height = Math.max(240, Math.floor(room)) + 'px';
}
let fitSoon;
window.addEventListener('resize', () => {
  clearTimeout(fitSoon);
  fitSoon = setTimeout(fitPlayer, 60);
});

function seekTo(t){
  if (!haveClip || !isFinite(t)) return;
  if (!clipShown) showClip(true);      // asking to watch a moment says as much
  const v = $('vid');
  const to = Math.max(0, t - LEADIN);
  const go = () => { v.currentTime = to; v.play().catch(() => {}); };
  if (v.readyState >= 1) go(); else v.addEventListener('loadedmetadata', go, {once: true});
  $('view').scrollTo({top: 0, behavior: 'smooth'});
}

// The clip and the marks under it are one thing: the marks only mean anything
// as a way into the video, so hiding it takes them with it and leaves the
// report the whole window.
let clipShown = true;

function showClip(on){
  clipShown = on;
  $('player').classList.toggle('on', on && haveClip);
  $('deck').classList.toggle('on', on && hasMarks);
  $('vclip').textContent = on ? 'Hide clip' : 'Show clip';
  if (!on) $('vid').pause();
  fitPlayer();
}

$('vclip').addEventListener('click', () => showClip(!clipShown));

window.addEventListener('pywebviewready', refresh);
</script>
</body>
</html>
